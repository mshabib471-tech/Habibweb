<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Repair Guy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-slate-200 bg-[#0f172a] relative flex flex-col items-center justify-center py-10 px-4">
  
  <div class="fixed inset-0 z-[-1] overflow-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-blue-900/20 blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-[#9E1B32]/20 blur-[150px]"></div>
  </div>

  <!-- ================= LOGIN SCREEN ================= -->
  <div id="loginScreen" class="max-w-[400px] w-full bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-[32px] shadow-2xl transition-all duration-500">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-white/10 border border-white/20 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg">
        <i data-feather="lock" class="text-rose-400 w-8 h-8"></i>
      </div>
      <h2 class="text-2xl font-bold text-white">Admin Portal</h2>
      <p class="text-slate-400 text-sm mt-2">Strictly Authorized Access Only</p>
    </div>

    <div class="space-y-5">
      <button id="googleLoginBtn" class="flex items-center justify-center gap-3 w-full bg-white text-slate-800 font-bold py-3.5 rounded-xl transition-all shadow-lg hover:-translate-y-0.5">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
        Sign in with Google
      </button>
      
      <p id="loginError" class="text-red-400 text-sm text-center font-medium hidden bg-red-500/10 p-3 rounded-lg border border-red-500/20">
        Access Denied! Only tec.habiburrahman@gmail.com is allowed.
      </p>
    </div>
    
    <div class="text-center mt-6">
      <a href="index.html" class="text-sm text-slate-400 hover:text-rose-400 transition-colors flex justify-center items-center gap-1">
        <i data-feather="arrow-left" class="w-4 h-4"></i> Back to Website
      </a>
    </div>
  </div>

  <!-- ================= ADMIN DASHBOARD ================= -->
  <div id="dashboardScreen" class="max-w-[800px] w-full bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-[32px] shadow-2xl hidden transition-all duration-500">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-white/10 pb-4 gap-4">
       <div>
         <h2 class="text-3xl font-bold text-white flex items-center gap-2">
           <i data-feather="shield" class="text-green-400"></i> Admin Dashboard
         </h2>
         <p class="text-sm text-rose-300 mt-1" id="loggedInEmailText">Logged in securely</p>
       </div>
       <div class="flex gap-4">
         <a href="index.html" class="text-slate-300 hover:text-white flex items-center gap-2 text-sm font-medium"><i data-feather="external-link" class="w-4 h-4"></i> View Site</a>
         <button onclick="logoutAdmin()" class="text-red-400 hover:text-red-300 flex items-center gap-2 text-sm font-medium"><i data-feather="log-out" class="w-4 h-4"></i> Logout</button>
       </div>
    </div>

    <h3 class="text-xl font-semibold text-white mb-4">Create New Blog/Video Post</h3>
    
    <form id="postForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-400 mb-1">Post Title</label>
        <input type="text" id="postTitle" required placeholder="E.g. iPhone 15 Display Replacement" class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white focus:border-rose-400 outline-none">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
           <label class="block text-sm font-medium text-slate-400 mb-1">Category</label>
           <select id="postCategory" class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-slate-300 outline-none">
             <option value="Repair Tip" class="bg-slate-800 text-white">Repair Tip</option>
             <option value="Video Review" class="bg-slate-800 text-white">Video Review</option>
             <option value="News" class="bg-slate-800 text-white">News</option>
           </select>
        </div>
        <div>
           <label class="block text-sm font-medium text-slate-400 mb-1">Image / YouTube Link</label>
           <input type="text" id="postMedia" required placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white focus:border-rose-400 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-400 mb-1">Description / Content</label>
        <textarea id="postDescription" rows="4" required placeholder="Write details about the post..." class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white focus:border-rose-400 outline-none resize-none"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-[#9E1B32]/90 hover:bg-[#9E1B32] text-white font-bold py-4 rounded-xl transition-all mt-4 shadow-[0_0_20px_rgba(158,27,50,0.3)]">
        Publish Post to Home Page & Blog
      </button>
      
      <p id="successMsg" class="hidden text-green-400 text-center mt-3 bg-green-500/10 p-3 rounded-lg border border-green-500/20 font-medium">✅ Post published successfully!</p>
    </form>

    <div class="mt-12 border-t border-white/10 pt-8">
        <h3 class="text-lg font-semibold text-white mb-4">Database Management</h3>
        <p class="text-sm text-slate-400 mb-4">Connected to Firebase Firestore Database.</p>
        <button onclick="clearPosts()" class="bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-400 px-6 py-3 rounded-xl text-sm font-semibold transition-all flex items-center gap-2">
          <i data-feather="trash-2" class="w-4 h-4"></i> Delete All Posts
        </button>
    </div>
  </div>

  <!-- Firebase & Admin Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAaLdtzOIZVYB-Bdc42CXm2T8iclWLc4o0",
      authDomain: "habib-yt.firebaseapp.com",
      projectId: "habib-yt",
      storageBucket: "habib-yt.firebasestorage.app",
      messagingSenderId: "656628491244",
      appId: "1:656628491244:web:e01ccd42bd8a2b1b4c96c9",
      measurementId: "G-GNY1T88D34"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getFirestore(app);

    feather.replace();

    const ALLOWED_ADMIN_EMAIL = "tec.habiburrahman@gmail.com";

    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const errorMsg = document.getElementById('loginError');
    const emailDisplay = document.getElementById('loggedInEmailText');

    // Monitor Auth State (Keeps user logged in after refresh)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        if (user.email.toLowerCase() === ALLOWED_ADMIN_EMAIL.toLowerCase()) {
          // Success Admin Login
          emailDisplay.innerText = `Logged in securely as ${user.email}`;
          errorMsg.classList.add('hidden');
          loginScreen.classList.add('hidden');
          dashboardScreen.classList.remove('hidden');
        } else {
          // Unauthorized Email
          signOut(auth);
          showError("Access Denied! Only tec.habiburrahman@gmail.com is allowed.");
        }
      } else {
        // Not logged in
        dashboardScreen.classList.add('hidden');
        loginScreen.classList.remove('hidden');
      }
    });

    // Login Action
    document.getElementById('googleLoginBtn').addEventListener('click', () => {
      const btn = document.getElementById('googleLoginBtn');
      btn.innerHTML = '<i data-feather="loader" class="w-5 h-5 animate-spin"></i> Checking...';
      feather.replace();

      signInWithPopup(auth, provider).then((result) => {
        const user = result.user;
        if (user.email.toLowerCase() !== ALLOWED_ADMIN_EMAIL.toLowerCase()) {
            signOut(auth);
            showError("Access Denied! Only tec.habiburrahman@gmail.com is allowed.");
        }
        resetBtnUI();
      }).catch((error) => {
        showError(error.message);
        resetBtnUI();
      });
    });

    function showError(message) {
      errorMsg.innerText = message;
      errorMsg.classList.remove('hidden');
    }

    function resetBtnUI() {
      const btn = document.getElementById('googleLoginBtn');
      btn.innerHTML = '<img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5"> Sign in with Google';
    }

    // Logout Action
    window.logoutAdmin = function() {
        signOut(auth).then(() => {
            dashboardScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            document.getElementById('postForm').reset();
        });
    }

    // Database Post Logic
    document.getElementById('postForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.innerText;
      submitBtn.innerText = "Publishing to Database...";
      submitBtn.disabled = true;
      
      try {
        await addDoc(collection(db, "blogPosts"), {
          title: document.getElementById('postTitle').value,
          category: document.getElementById('postCategory').value,
          mediaLink: document.getElementById('postMedia').value,
          description: document.getElementById('postDescription').value,
          date: new Date().toLocaleDateString(),
          timestamp: Date.now(),
          likes: 0,
          comments: []
        });

        const msg = document.getElementById('successMsg');
        msg.classList.remove('hidden');
        this.reset();
        setTimeout(() => msg.classList.add('hidden'), 4000);
      } catch (e) {
        alert("Error adding document: " + e.message);
      } finally {
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
      }
    });

    // Delete All Posts
    window.clearPosts = async function() {
        if(confirm("Are you SURE you want to delete all blog posts? This action cannot be undone.")) {
            try {
                const querySnapshot = await getDocs(collection(db, "blogPosts"));
                querySnapshot.forEach(async (document) => {
                    await deleteDoc(doc(db, "blogPosts", document.id));
                });
                alert("All posts deleted successfully!");
            } catch(e) {
                alert("Error deleting posts: " + e.message);
            }
        }
    }
  </script>
</body>
</html>
