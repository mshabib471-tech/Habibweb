<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Repair Guy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-slate-200 bg-[#0f172a] relative flex flex-col items-center justify-center py-10 px-4">
  
  <div class="fixed inset-0 z-[-1] overflow-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-blue-900/20 blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-[#9E1B32]/20 blur-[150px]"></div>
  </div>

  <div class="max-w-[800px] w-full bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-[32px] shadow-2xl">
    
    <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
       <h2 class="text-3xl font-bold text-white">Admin Dashboard</h2>
       <a href="index.html" class="text-rose-400 hover:text-white flex items-center gap-2"><i data-feather="home" class="w-4 h-4"></i> Go Home</a>
    </div>

    <h3 class="text-xl font-semibold text-white mb-4">Create New Blog/Video Post</h3>
    
    <form id="postForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-400 mb-1">Post Title</label>
        <input type="text" id="postTitle" required class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white focus:border-rose-400 outline-none">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
           <label class="block text-sm font-medium text-slate-400 mb-1">Category</label>
           <select id="postCategory" class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white outline-none">
             <option value="Repair Tip">Repair Tip</option>
             <option value="Video Review">Video Review</option>
             <option value="News">News</option>
           </select>
        </div>
        <div>
           <label class="block text-sm font-medium text-slate-400 mb-1">Image / YouTube Link</label>
           <input type="text" id="postMedia" placeholder="https://..." class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white focus:border-rose-400 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-400 mb-1">Description / Content</label>
        <textarea id="postDescription" rows="4" required class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white focus:border-rose-400 outline-none"></textarea>
      </div>

      <button type="submit" class="w-full bg-[#9E1B32]/90 hover:bg-[#9E1B32] text-white font-bold py-4 rounded-xl transition-all mt-4">
        Publish Post to Home Page
      </button>
      
      <p id="successMsg" class="hidden text-green-400 text-center mt-3 bg-green-500/10 p-2 rounded-lg border border-green-500/20">Post published successfully!</p>
    </form>

    <div class="mt-12 border-t border-white/10 pt-8">
        <h3 class="text-lg font-semibold text-white mb-4">Manage Posts</h3>
        <button onclick="clearPosts()" class="bg-red-500/20 hover:bg-red-500/40 border border-red-500/50 text-red-300 px-4 py-2 rounded-lg text-sm transition-all">Delete All Posts</button>
    </div>
  </div>

  <script>
    feather.replace();

    document.getElementById('postForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const newPost = {
        title: document.getElementById('postTitle').value,
        category: document.getElementById('postCategory').value,
        mediaLink: document.getElementById('postMedia').value,
        description: document.getElementById('postDescription').value,
        date: new Date().toLocaleDateString()
      };

      // Get existing posts or empty array
      let posts = JSON.parse(localStorage.getItem('blogPosts')) || [];
      
      // Add new post
      posts.push(newPost);
      
      // Save back to local storage
      localStorage.setItem('blogPosts', JSON.stringify(posts));

      // Show success
      const msg = document.getElementById('successMsg');
      msg.classList.remove('hidden');
      this.reset();
      
      setTimeout(() => {
        msg.classList.add('hidden');
      }, 3000);
    });

    function clearPosts() {
        if(confirm("Are you sure you want to delete all blog posts?")) {
            localStorage.removeItem('blogPosts');
            alert("All posts deleted. Check the Home page.");
        }
    }
  </script>
</body>
</html>
