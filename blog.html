<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habib iFix - Social Feed</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    /* Hide scrollbar for neatness */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom Scrollbar for Desktop */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9E1B32; }

    /* Animations */
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fade-in-up 0.5s ease-out forwards; }

    @keyframes heart-beat {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .animate-heart { animation: heart-beat 0.3s ease-in-out; }

    /* Glassmorphism Utilities */
    .glass-panel {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-screen text-slate-200 selection:bg-[#9E1B32] selection:text-white relative flex flex-col bg-[#0f172a]">

  <!-- ================= ANIMATED BACKGROUND ================= -->
  <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-[#9E1B32]/20 blur-[120px] animate-blob"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-blue-900/20 blur-[150px] animate-blob animation-delay-2000"></div>
  </div>

  <!-- ================= HEADER (Glass) ================= -->
  <header class="fixed top-0 left-0 right-0 z-50 glass-panel transition-all duration-300 py-3">
    <div class="max-w-[900px] mx-auto px-4 flex items-center justify-between">
      
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-2 cursor-pointer group">
        <div class="w-9 h-9 rounded-lg overflow-hidden border border-white/20 bg-white/10 shadow-lg flex items-center justify-center group-hover:border-rose-500/50 transition-colors">
          <img src="https://i.ibb.co.com/2XJPZ5X/Chat-GPT-Image-Aug-15-2026-12-34-42-PM.png" alt="Logo" class="w-full h-full object-cover">
        </div>
        <span class="font-bold text-xl tracking-tight text-white hidden sm:block">Habib<span class="text-slate-400 font-medium">iFix</span></span>
      </a>

      <!-- Navigation & Auth -->
      <div class="flex items-center gap-4">
        <nav class="flex items-center gap-4 text-slate-300">
          <a href="index.html" class="hover:text-white transition-colors p-2 hover:bg-white/5 rounded-lg"><i data-feather="home" class="w-6 h-6"></i></a>
          <a href="blog.html" class="text-white transition-colors p-2 bg-white/10 rounded-lg shadow-inner"><i data-feather="compass" class="w-6 h-6 fill-current"></i></a>
        </nav>

        <!-- Auth Profile Area -->
        <div id="authProfileArea" class="relative group">
            <a href="login.html?return=blog.html" id="loginNavBtn" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-1.5 rounded-full transition-all shadow-[0_0_15px_rgba(225,29,72,0.4)] flex items-center gap-2 text-sm font-bold">
                Login <i data-feather="log-in" class="w-4 h-4"></i>
            </a>

            <!-- Avatar Dropdown -->
            <div id="userProfileMenu" class="hidden relative cursor-pointer flex items-center gap-2">
                <div class="relative">
                    <img id="headerAvatar" src="https://www.svgrepo.com/show/5125/avatar.svg" class="w-9 h-9 rounded-full object-cover border-2 border-transparent group-hover:border-rose-500 transition-all shadow-lg">
                    <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-[#0f172a] rounded-full"></span>
                </div>
                
                <div class="absolute top-full right-0 mt-3 w-56 bg-[#1e293b] border border-white/10 rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 overflow-hidden flex flex-col z-50 transform origin-top-right scale-95 group-hover:scale-100">
                    <div class="px-4 py-3 border-b border-white/5">
                        <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">My Account</p>
                    </div>
                    <label class="px-4 py-3 text-sm text-slate-200 hover:text-white hover:bg-white/5 cursor-pointer flex items-center gap-3 transition-colors">
                        <i data-feather="camera" class="w-4 h-4 text-rose-400"></i> Change Picture
                        <input type="file" id="profilePicInput" accept="image/*" class="hidden">
                    </label>
                    <button onclick="logoutCurrentUser()" class="px-4 py-3 text-sm text-red-400 hover:text-red-300 hover:bg-red-500/10 text-left flex items-center gap-3 transition-colors w-full">
                        <i data-feather="log-out" class="w-4 h-4"></i> Sign Out
                    </button>
                </div>
            </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= INSTAGRAM STYLE NEWS FEED ================= -->
  <main class="flex-grow pt-[80px] pb-20 px-0 sm:px-4 relative z-10 flex justify-center">
    
    <!-- Feed Container -->
    <div class="w-full max-w-[550px]">
      
      <!-- Admin Notice (Hidden by default) -->
      <div id="adminNotice" class="hidden bg-gradient-to-r from-rose-500/10 to-purple-500/10 border border-rose-500/20 text-rose-300 p-4 rounded-2xl mb-6 text-center text-sm font-medium flex items-center justify-center gap-2 backdrop-blur-md animate-fade-in-up">
          <i data-feather="shield" class="w-4 h-4 text-rose-500"></i> 
          <span>Admin Mode Active: You have full control.</span>
      </div>

      <!-- Stories / Highlights Placeholder (Visual Only) -->
      <div class="flex gap-4 overflow-x-auto no-scrollbar pb-6 px-2 mb-2">
         <div class="flex flex-col items-center gap-1 min-w-[70px] cursor-pointer group">
            <div class="w-[70px] h-[70px] rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-rose-500 to-purple-600 group-hover:scale-105 transition-transform">
               <div class="w-full h-full rounded-full border-2 border-[#0f172a] overflow-hidden bg-slate-800 flex items-center justify-center">
                  <i data-feather="plus" class="text-white w-8 h-8"></i>
               </div>
            </div>
            <span class="text-xs text-slate-400">Add Story</span>
         </div>
         <!-- Mock Story 1 -->
         <div class="flex flex-col items-center gap-1 min-w-[70px] cursor-pointer group">
            <div class="w-[70px] h-[70px] rounded-full p-[2px] bg-gradient-to-tr from-yellow-400 via-rose-500 to-purple-600 group-hover:scale-105 transition-transform">
               <img src="https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?auto=format&fit=crop&q=80&w=150" class="w-full h-full rounded-full border-2 border-[#0f172a] object-cover">
            </div>
            <span class="text-xs text-slate-400">Repair Tips</span>
         </div>
         <!-- Mock Story 2 -->
         <div class="flex flex-col items-center gap-1 min-w-[70px] cursor-pointer group">
            <div class="w-[70px] h-[70px] rounded-full p-[2px] bg-gradient-to-tr from-blue-400 to-emerald-500 group-hover:scale-105 transition-transform">
               <img src="https://images.unsplash.com/photo-1581092921461-eab62e97a780?auto=format&fit=crop&q=80&w=150" class="w-full h-full rounded-full border-2 border-[#0f172a] object-cover">
            </div>
            <span class="text-xs text-slate-400">Workshop</span>
         </div>
      </div>

      <div id="blog-container" class="space-y-6">
        <!-- Skeleton Loader -->
        <div class="flex flex-col items-center justify-center py-20 space-y-4">
            <div class="w-10 h-10 border-4 border-rose-500/30 border-t-rose-500 rounded-full animate-spin"></div>
            <p class="text-slate-500 text-sm font-medium animate-pulse">Loading latest updates...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Firebase & App Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, doc, updateDoc, arrayUnion, arrayRemove, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAaLdtzOIZVYB-Bdc42CXm2T8iclWLc4o0",
      authDomain: "habib-yt.firebaseapp.com",
      projectId: "habib-yt",
      storageBucket: "habib-yt.firebasestorage.app",
      messagingSenderId: "656628491244",
      appId: "1:656628491244:web:e01ccd42bd8a2b1b4c96c9",
      measurementId: "G-GNY1T88D34"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const authInstance = getAuth(app);
    const storageInstance = getStorage(app);

    feather.replace();

    let globalUserEmail = null;
    let globalUserAvatar = 'https://www.svgrepo.com/show/5125/avatar.svg';
    let isAdmin = false;
    const ALLOWED_ADMIN_EMAIL = "tec.habiburrahman@gmail.com".toLowerCase();

    // Store local state of likes to avoid full reloads when clicking like
    window.postLikesState = {};

    // Auth State Observer
    onAuthStateChanged(authInstance, (user) => {
        const loginBtn = document.getElementById('loginNavBtn');
        const profileMenu = document.getElementById('userProfileMenu');
        
        if (user) {
            loginBtn.classList.add('hidden');
            profileMenu.classList.remove('hidden');
            
            globalUserAvatar = user.photoURL || 'https://www.svgrepo.com/show/5125/avatar.svg';
            document.getElementById('headerAvatar').src = globalUserAvatar;
            globalUserEmail = user.email || user.phoneNumber;
            
            // Check if admin
            if(user.email && user.email.toLowerCase() === ALLOWED_ADMIN_EMAIL) {
                isAdmin = true;
                document.getElementById('adminNotice').classList.remove('hidden');
            }
        } else {
            loginBtn.classList.remove('hidden');
            profileMenu.classList.add('hidden');
            globalUserEmail = null;
            isAdmin = false;
        }
        
        // Fetch posts after determining auth state so UI renders correctly
        loadFullBlogPosts();
    });

    // Profile Upload Logic
    const picInput = document.getElementById('profilePicInput');
    if (picInput) {
        picInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file || !authInstance.currentUser) return;
            
            document.getElementById('headerAvatar').src = "https://www.svgrepo.com/show/285573/loading-spinner.svg";
            
            try {
                const storageRef = ref(storageInstance, 'avatars/' + authInstance.currentUser.uid);
                await uploadBytes(storageRef, file);
                const photoURL = await getDownloadURL(storageRef);
                
                await updateProfile(authInstance.currentUser, { photoURL: photoURL });
                document.getElementById('headerAvatar').src = photoURL;
                globalUserAvatar = photoURL;
                alert("Profile picture updated!");
            } catch (error) {
                alert("Upload failed: " + error.message);
                document.getElementById('headerAvatar').src = globalUserAvatar;
            }
        });
    }

    // Logout
    window.logoutCurrentUser = function() {
        signOut(authInstance).then(() => {
            window.location.reload();
        });
    };

    // Load Posts
    async function loadFullBlogPosts() {
      const blogContainer = document.getElementById('blog-container');
      
      try {
        const q = query(collection(db, "blogPosts"), orderBy("timestamp", "desc"));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) {
          blogContainer.innerHTML = `
            <div class="text-center py-20 bg-white/5 rounded-3xl border border-white/10 mt-4">
                <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-600">
                    <i data-feather="inbox" class="w-10 h-10"></i>
                </div>
                <h3 class="text-xl font-bold text-white mb-2">No Posts Yet</h3>
                <p class="text-slate-400">Check back later for updates!</p>
            </div>`;
          feather.replace();
          return;
        }

        blogContainer.innerHTML = ''; 
        
        querySnapshot.forEach((documentSnapshot) => {
          const post = documentSnapshot.data();
          const postId = documentSnapshot.id;
          
          // Media Handling
          let mediaHTML = '';
          if (post.mediaLink && (post.mediaLink.includes('youtube.com') || post.mediaLink.includes('youtu.be'))) {
             const videoId = post.mediaLink.split('v=')[1]?.substring(0, 11) || post.mediaLink.split('youtu.be/')[1]?.substring(0, 11);
             mediaHTML = `<div class="relative aspect-video bg-black"><iframe class="w-full h-full absolute inset-0" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe></div>`;
          } else if (post.mediaType && post.mediaType.startsWith('video')) {
             mediaHTML = `
                <video class="w-full max-h-[600px] object-cover bg-black" controls controlsList="nodownload">
                   <source src="${post.mediaLink}" type="${post.mediaType}">
                </video>`;
          } else {
             mediaHTML = `<img src="${post.mediaLink || 'https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?w=800&q=80'}" class="w-full max-h-[600px] object-cover bg-[#1e293b]" alt="Post Media" loading="lazy">`;
          }

          // Like Logic Setup
          const likedByArray = post.likedBy || [];
          const isLiked = globalUserEmail && likedByArray.includes(globalUserEmail);
          
          // Save state locally
          window.postLikesState[postId] = { likedBy: [...likedByArray] };
          
          const heartFill = isLiked ? '#f43f5e' : 'none';
          const heartColor = isLiked ? '#f43f5e' : 'currentColor';
          const heartClass = isLiked ? 'text-rose-500' : 'text-white hover:text-slate-400';

          // Comments Setup
          const commentsArray = post.comments || [];
          let commentsHTML = commentsArray.map(c => `
             <div class="mb-2 text-sm leading-snug animate-fade-in-up">
                <span class="font-bold text-white mr-2 cursor-pointer hover:underline">${c.user}</span>
                <span class="text-slate-300">${c.text}</span>
                <div class="text-[10px] text-slate-500 mt-0.5 ml-1 flex gap-3">
                    <span>${c.date || 'Now'}</span>
                    <span class="cursor-pointer hover:text-slate-300">Reply</span>
                </div>
             </div>
          `).join('');

          // Delete Button (Admin Only)
          const deleteBtnHTML = isAdmin ? `
             <button onclick="deleteSinglePost('${postId}')" class="text-slate-500 hover:text-red-500 p-2 transition-colors rounded-full hover:bg-red-500/10" title="Delete Post">
                 <i data-feather="trash-2" class="w-5 h-5"></i>
             </button>` : `<button class="text-slate-400 hover:text-white p-2 transition-colors rounded-full hover:bg-white/10"><i data-feather="more-horizontal" class="w-5 h-5"></i></button>`;

          const postElement = document.createElement('article');
          postElement.className = "bg-[#0f172a] sm:rounded-2xl border border-white/10 shadow-xl overflow-hidden animate-fade-in-up mb-8";
          
          postElement.innerHTML = `
            <!-- Header -->
            <div class="flex items-center justify-between p-3 md:p-4">
                <div class="flex items-center gap-3 cursor-pointer">
                    <div class="w-9 h-9 rounded-full overflow-hidden border border-rose-500/30 p-[1.5px]">
                        <img src="https://i.ibb.co.com/Ps26xXt6/Chat-GPT-Image-Aug-11-2026-06-19-28-PM.png" class="w-full h-full rounded-full object-cover">
                    </div>
                    <div class="flex flex-col leading-tight">
                        <span class="font-bold text-sm text-white flex items-center gap-1">Habib Tec. <i data-feather="check-circle" class="w-3 h-3 text-blue-400 fill-blue-400"></i></span>
                        <span class="text-[11px] text-slate-500 font-medium">${post.date} • ${post.category || 'Update'}</span>
                    </div>
                </div>
                <div>${deleteBtnHTML}</div>
            </div>

            <!-- Media Content (Edge to Edge) -->
            <div class="w-full bg-black border-y border-white/5 relative group">
                ${mediaHTML}
            </div>
            
            <!-- Actions & Content -->
            <div class="p-3 md:p-4 pt-4">
                
                <!-- Action Icons -->
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-4">
                        <button onclick="toggleLike('${postId}')" class="focus:outline-none transform active:scale-75 transition-transform duration-200">
                            <svg id="heart-icon-${postId}" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="${heartFill}" stroke="${heartColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${heartClass} transition-colors duration-200">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                        </button>
                        <button onclick="focusComment('${postId}')" class="text-white hover:text-slate-400 focus:outline-none transition-colors transform active:scale-90">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        </button>
                        <button class="text-white hover:text-slate-400 focus:outline-none transition-colors transform active:scale-90">
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                    <!-- Bookmark Icon -->
                    <button class="text-white hover:text-slate-400 focus:outline-none transition-colors">
                         <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                    </button>
                </div>

                <!-- Likes Count -->
                <p class="font-bold text-sm text-white mb-2" id="like-count-${postId}">${likedByArray.length.toLocaleString()} likes</p>

                <!-- Caption -->
                <div class="text-sm text-slate-200 mb-3 leading-relaxed">
                    <span class="font-bold text-white mr-2">Habib Tec.</span> ${post.description}
                </div>

                <!-- Comments Toggle -->
                ${commentsArray.length > 0 ? `<button onclick="toggleComments('${postId}')" class="text-sm text-slate-500 mb-3 focus:outline-none cursor-pointer hover:text-slate-400">View all ${commentsArray.length} comments</button>` : ''}

                <!-- Comments Display Box -->
                <div id="comment-section-${postId}" class="hidden flex-col gap-1 mb-3 max-h-48 overflow-y-auto no-scrollbar pr-2">
                    ${commentsHTML}
                </div>

                <!-- Add Comment Input -->
                <div class="flex items-center gap-3 border-t border-white/10 pt-3 mt-1">
                    <img src="${globalUserAvatar}" class="w-7 h-7 rounded-full object-cover border border-white/10">
                    <input type="text" id="comment-input-${postId}" placeholder="Add a comment..." class="bg-transparent flex-grow text-sm text-white focus:outline-none placeholder-slate-500" onclick="checkAuthBeforeAction()">
                    <button onclick="submitComment('${postId}')" class="text-blue-400 font-bold text-sm hover:text-white transition-colors focus:outline-none disabled:opacity-50">Post</button>
                </div>

            </div>
          `;
          blogContainer.appendChild(postElement);
        });
        feather.replace();
      } catch (error) {
        console.log("Error loading posts:", error);
        blogContainer.innerHTML = `<p class="text-center text-red-400">Failed to load feed.</p>`;
      }
    }

    // Auth Check Helper
    window.checkAuthBeforeAction = function() {
        if (!globalUserEmail) {
            window.location.href = 'login.html?return=blog.html';
            return false;
        }
        return true;
    }

    window.focusComment = function(postId) {
        if(!checkAuthBeforeAction()) return;
        document.getElementById(`comment-input-${postId}`).focus();
        toggleComments(postId, true); // Force open
    }

    // Toggle Single Like (One User = One Like)
    window.toggleLike = async function(postId) {
        if (!checkAuthBeforeAction()) return;

        const state = window.postLikesState[postId];
        const hasLiked = state.likedBy.includes(globalUserEmail);
        const postRef = doc(db, "blogPosts", postId);
        
        const heartIcon = document.getElementById(`heart-icon-${postId}`);
        const likeCount = document.getElementById(`like-count-${postId}`);

        // Optimistic UI Update
        if (hasLiked) {
            heartIcon.setAttribute('fill', 'none');
            heartIcon.setAttribute('stroke', 'currentColor');
            heartIcon.classList.remove('text-rose-500');
            heartIcon.classList.add('text-white');
            state.likedBy = state.likedBy.filter(e => e !== globalUserEmail);
        } else {
            heartIcon.setAttribute('fill', '#f43f5e'); 
            heartIcon.setAttribute('stroke', '#f43f5e');
            heartIcon.classList.remove('text-white');
            heartIcon.classList.add('text-rose-500');
            heartIcon.classList.add('animate-heart');
            setTimeout(() => heartIcon.classList.remove('animate-heart'), 300);
            state.likedBy.push(globalUserEmail);
        }
        likeCount.innerText = `${state.likedBy.length.toLocaleString()} likes`;

        try {
            if (hasLiked) {
                await updateDoc(postRef, { likedBy: arrayRemove(globalUserEmail) });
            } else {
                await updateDoc(postRef, { likedBy: arrayUnion(globalUserEmail) });
            }
        } catch (error) {
            console.error("Error updating like:", error);
            // Revert UI on error ideally, but keeping simple for now
        }
    }

    // Toggle Comments visibility
    window.toggleComments = function(postId, forceOpen = false) {
        const section = document.getElementById(`comment-section-${postId}`);
        if(forceOpen) {
            section.classList.remove('hidden');
            section.classList.add('flex');
        } else {
            section.classList.toggle('hidden');
            section.classList.toggle('flex');
        }
    }

    // Submit Comment
    window.submitComment = async function(postId) {
        if (!checkAuthBeforeAction()) return;

        const inputField = document.getElementById(`comment-input-${postId}`);
        const text = inputField.value.trim();
        if (!text) return;

        inputField.value = ''; 
        let displayName = globalUserEmail.includes('@') ? globalUserEmail.split('@')[0] : "User_" + globalUserEmail.substring(globalUserEmail.length - 4);

        const newComment = {
            user: displayName, 
            text: text,
            date: new Date().toLocaleDateString()
        };

        const list = document.getElementById(`comment-section-${postId}`);
        list.classList.remove('hidden');
        list.classList.add('flex');
        
        // Add to DOM immediately
        const commentDiv = document.createElement('div');
        commentDiv.className = "mb-2 text-sm leading-snug animate-fade-in-up";
        commentDiv.innerHTML = `
            <span class="font-bold text-white mr-2">${newComment.user}</span>
            <span class="text-slate-300">${newComment.text}</span>
            <div class="text-[10px] text-slate-500 mt-0.5 ml-1">Just now</div>
        `;
        list.appendChild(commentDiv);
        list.scrollTop = list.scrollHeight; 

        try {
            const postRef = doc(db, "blogPosts", postId);
            await updateDoc(postRef, {
                comments: arrayUnion(newComment)
            });
        } catch (error) {
            console.error("Error posting comment: ", error);
            alert("Failed to post comment.");
        }
    }

    // Delete Single Post (Admin Only)
    window.deleteSinglePost = async function(postId) {
        if (!isAdmin) return;
        
        if (confirm("Are you SURE you want to delete this specific post? This cannot be undone.")) {
            try {
                await deleteDoc(doc(db, "blogPosts", postId));
                // Remove from DOM
                event.target.closest('article').remove();
            } catch (error) {
                alert("Failed to delete post: " + error.message);
            }
        }
    }

  </script>
</body>
</html>
