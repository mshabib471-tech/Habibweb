<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Feed - Habib Tec.</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Hide scrollbar for neatness */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen text-slate-200 selection:bg-[#9E1B32] selection:text-white relative flex flex-col bg-[#0f172a]">

  <!-- ================= ANIMATED BACKGROUND ================= -->
  <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-[#9E1B32]/30 blur-[120px] animate-blob"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-blue-900/20 blur-[150px] animate-blob animation-delay-2000"></div>
  </div>

  <!-- ================= HEADER (Glass) ================= -->
  <header id="main-header" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-[#0f172a]/90 backdrop-blur-xl border-b border-white/10 shadow-lg py-3">
    <div class="max-w-[1280px] mx-auto px-4 md:px-6 flex items-center justify-between">
      
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-3 cursor-pointer">
        <div class="w-10 h-10 rounded-xl overflow-hidden border border-white/20 bg-white/10 backdrop-blur-md shadow-lg flex items-center justify-center">
          <img src="https://i.ibb.co.com/Ps26xXt6/Chat-GPT-Image-Aug-11-2026-06-19-28-PM.png" alt="Habib Tec. Logo" class="w-full h-full object-cover">
        </div>
        <span class="font-bold text-xl md:text-2xl tracking-tight text-white hidden sm:block">Habib<span class="text-slate-400 font-medium">Tec.</span></span>
      </a>

      <!-- Navigation & Auth -->
      <div class="flex items-center gap-6">
        <nav class="hidden md:flex items-center gap-6 font-medium text-sm text-slate-200">
          <a href="index.html" class="hover:text-rose-400 transition-colors"><i data-feather="home" class="w-5 h-5"></i></a>
          <a href="blog.html" class="text-rose-400 transition-colors"><i data-feather="compass" class="w-5 h-5"></i></a>
        </nav>

        <!-- Auth Profile Area -->
        <div id="authProfileArea" class="relative group">
            <a href="login.html?return=blog.html" id="loginNavBtn" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center gap-2 cursor-pointer font-bold text-sm">
                Login <i data-feather="log-in" class="w-4 h-4"></i>
            </a>

            <!-- Avatar -->
            <div id="userProfileMenu" class="hidden relative cursor-pointer flex items-center gap-2">
                <img id="headerAvatar" src="https://www.svgrepo.com/show/5125/avatar.svg" class="w-9 h-9 rounded-full object-cover border-2 border-rose-400 shadow-lg">
                
                <div class="absolute top-full right-0 mt-3 w-48 bg-[#1e293b] border border-white/10 rounded-xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 overflow-hidden flex flex-col z-50">
                    <label class="px-4 py-3 text-sm text-slate-200 hover:text-white hover:bg-white/10 cursor-pointer flex items-center gap-2 border-b border-white/5 transition-colors">
                        <i data-feather="camera" class="w-4 h-4 text-rose-400"></i> Change Picture
                        <input type="file" id="profilePicInput" accept="image/*" class="hidden">
                    </label>
                    <button onclick="logoutCurrentUser()" class="px-4 py-3 text-sm text-red-400 hover:text-red-300 hover:bg-white/10 text-left flex items-center gap-2 transition-colors">
                        <i data-feather="log-out" class="w-4 h-4"></i> Logout
                    </button>
                </div>
            </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= INSTAGRAM STYLE NEWS FEED ================= -->
  <main class="flex-grow pt-[100px] pb-20 px-0 sm:px-4 relative z-10 flex justify-center">
    
    <!-- Feed Container -->
    <div class="w-full max-w-[500px]">
      
      <!-- Admin Notice (Hidden by default) -->
      <div id="adminNotice" class="hidden bg-rose-500/10 border border-rose-500/20 text-rose-400 p-3 rounded-xl mb-6 text-center text-sm font-bold flex items-center justify-center gap-2">
          <i data-feather="shield" class="w-4 h-4"></i> Admin Mode: You can delete posts.
      </div>

      <div id="blog-container" class="space-y-6">
        <!-- Skeleton Loader -->
        <div class="text-center py-10">
            <i data-feather="loader" class="w-8 h-8 text-rose-400 animate-spin mx-auto mb-4"></i>
            <p class="text-slate-400 text-sm">Loading feed...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Firebase & App Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, doc, updateDoc, arrayUnion, arrayRemove, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAaLdtzOIZVYB-Bdc42CXm2T8iclWLc4o0",
      authDomain: "habib-yt.firebaseapp.com",
      projectId: "habib-yt",
      storageBucket: "habib-yt.firebasestorage.app",
      messagingSenderId: "656628491244",
      appId: "1:656628491244:web:e01ccd42bd8a2b1b4c96c9",
      measurementId: "G-GNY1T88D34"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const authInstance = getAuth(app);
    const storageInstance = getStorage(app);

    feather.replace();

    let globalUserEmail = null;
    let globalUserAvatar = 'https://www.svgrepo.com/show/5125/avatar.svg';
    let isAdmin = false;
    const ALLOWED_ADMIN_EMAIL = "tec.habiburrahman@gmail.com".toLowerCase();

    // Store local state of likes to avoid full reloads when clicking like
    window.postLikesState = {};

    // Auth State Observer
    onAuthStateChanged(authInstance, (user) => {
        const loginBtn = document.getElementById('loginNavBtn');
        const profileMenu = document.getElementById('userProfileMenu');
        
        if (user) {
            loginBtn.classList.add('hidden');
            profileMenu.classList.remove('hidden');
            
            globalUserAvatar = user.photoURL || 'https://www.svgrepo.com/show/5125/avatar.svg';
            document.getElementById('headerAvatar').src = globalUserAvatar;
            globalUserEmail = user.email || user.phoneNumber;
            
            // Check if admin
            if(user.email && user.email.toLowerCase() === ALLOWED_ADMIN_EMAIL) {
                isAdmin = true;
                document.getElementById('adminNotice').classList.remove('hidden');
            }
        } else {
            loginBtn.classList.remove('hidden');
            profileMenu.classList.add('hidden');
            globalUserEmail = null;
            isAdmin = false;
        }
        
        // Fetch posts after determining auth state so UI renders correctly
        loadFullBlogPosts();
    });

    // Profile Upload Logic
    const picInput = document.getElementById('profilePicInput');
    if (picInput) {
        picInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file || !authInstance.currentUser) return;
            
            document.getElementById('headerAvatar').src = "https://www.svgrepo.com/show/285573/loading-spinner.svg";
            
            try {
                const storageRef = ref(storageInstance, 'avatars/' + authInstance.currentUser.uid);
                await uploadBytes(storageRef, file);
                const photoURL = await getDownloadURL(storageRef);
                
                await updateProfile(authInstance.currentUser, { photoURL: photoURL });
                document.getElementById('headerAvatar').src = photoURL;
                globalUserAvatar = photoURL;
                alert("Profile picture updated!");
            } catch (error) {
                alert("Upload failed: " + error.message);
                document.getElementById('headerAvatar').src = globalUserAvatar;
            }
        });
    }

    // Logout
    window.logoutCurrentUser = function() {
        signOut(authInstance).then(() => {
            window.location.reload();
        });
    };

    // Load Posts
    async function loadFullBlogPosts() {
      const blogContainer = document.getElementById('blog-container');
      
      try {
        const q = query(collection(db, "blogPosts"), orderBy("timestamp", "desc"));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) {
          blogContainer.innerHTML = `<div class="text-center text-slate-400 py-10"><i data-feather="camera-off" class="mx-auto w-10 h-10 mb-4 opacity-50"></i><p>No posts yet.</p></div>`;
          feather.replace();
          return;
        }

        blogContainer.innerHTML = ''; 
        
        querySnapshot.forEach((documentSnapshot) => {
          const post = documentSnapshot.data();
          const postId = documentSnapshot.id;
          
          // Media Handling
          let mediaHTML = '';
          if (post.mediaLink && (post.mediaLink.includes('youtube.com') || post.mediaLink.includes('youtu.be'))) {
             const videoId = post.mediaLink.split('v=')[1]?.substring(0, 11) || post.mediaLink.split('youtu.be/')[1]?.substring(0, 11);
             mediaHTML = `<iframe class="w-full aspect-video" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>`;
          } else if (post.mediaType && post.mediaType.startsWith('video')) {
             mediaHTML = `
                <video class="w-full max-h-[600px] object-cover bg-black" controls controlsList="nodownload">
                   <source src="${post.mediaLink}" type="${post.mediaType}">
                </video>`;
          } else {
             mediaHTML = `<img src="${post.mediaLink || 'https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?w=800&q=80'}" class="w-full max-h-[600px] object-cover bg-[#0f172a]" alt="Post Media" loading="lazy">`;
          }

          // Like Logic Setup
          const likedByArray = post.likedBy || [];
          const isLiked = globalUserEmail && likedByArray.includes(globalUserEmail);
          
          // Save state locally
          window.postLikesState[postId] = { likedBy: [...likedByArray] };
          
          const heartFill = isLiked ? '#f43f5e' : 'none';
          const heartColor = isLiked ? '#f43f5e' : 'currentColor';
          const heartClass = isLiked ? 'text-rose-500' : 'text-white hover:text-slate-400';

          // Comments Setup
          const commentsArray = post.comments || [];
          let commentsHTML = commentsArray.map(c => `
             <div class="mb-1 text-sm leading-tight">
                <span class="font-bold text-white mr-1">${c.user}</span>
                <span class="text-slate-200">${c.text}</span>
             </div>
          `).join('');

          // Delete Button (Admin Only)
          const deleteBtnHTML = isAdmin ? `
             <button onclick="deleteSinglePost('${postId}')" class="text-slate-500 hover:text-red-500 p-1 transition-colors" title="Delete Post">
                 <i data-feather="trash-2" class="w-5 h-5"></i>
             </button>` : `<i data-feather="more-horizontal" class="w-5 h-5 text-slate-400"></i>`;

          const postElement = document.createElement('div');
          postElement.className = "bg-[#1e293b]/80 sm:rounded-2xl border-y sm:border border-white/10 shadow-lg overflow-hidden animate-fade-in-up";
          
          postElement.innerHTML = `
            <!-- Header -->
            <div class="flex items-center justify-between p-3 md:p-4">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full overflow-hidden border border-rose-500/50 p-0.5">
                        <img src="https://i.ibb.co.com/Ps26xXt6/Chat-GPT-Image-Aug-11-2026-06-19-28-PM.png" class="w-full h-full rounded-full object-cover">
                    </div>
                    <div class="flex flex-col leading-tight">
                        <span class="font-bold text-sm text-white">Habib Tec.</span>
                        <span class="text-[11px] text-slate-400">${post.date} • ${post.category || 'Update'}</span>
                    </div>
                </div>
                <div>${deleteBtnHTML}</div>
            </div>

            <!-- Media Content (Edge to Edge) -->
            <div class="w-full bg-black border-y border-white/5">
                ${mediaHTML}
            </div>
            
            <!-- Actions & Content -->
            <div class="p-3 md:p-4 pt-3">
                
                <!-- Action Icons -->
                <div class="flex items-center gap-4 mb-3">
                    <button onclick="toggleLike('${postId}')" class="focus:outline-none transform active:scale-90 transition-transform">
                        <svg id="heart-icon-${postId}" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="${heartFill}" stroke="${heartColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${heartClass} transition-colors duration-200">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>
                    <button onclick="toggleComments('${postId}')" class="text-white hover:text-slate-400 focus:outline-none transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    </button>
                    <button class="text-white hover:text-slate-400 focus:outline-none transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>

                <!-- Likes Count -->
                <p class="font-bold text-sm text-white mb-2" id="like-count-${postId}">${likedByArray.length} likes</p>

                <!-- Caption -->
                <div class="text-sm text-slate-200 mb-2 leading-relaxed">
                    <span class="font-bold text-white mr-1">Habib Tec.</span> ${post.description}
                </div>

                <!-- Comments Toggle -->
                ${commentsArray.length > 0 ? `<button onclick="toggleComments('${postId}')" class="text-sm text-slate-400 mb-2 focus:outline-none">View all ${commentsArray.length} comments</button>` : ''}

                <!-- Comments Display Box -->
                <div id="comment-section-${postId}" class="hidden flex-col gap-1 mb-3 max-h-40 overflow-y-auto no-scrollbar">
                    ${commentsHTML}
                </div>

                <!-- Add Comment Input -->
                <div class="flex items-center gap-3 border-t border-white/10 pt-3 mt-2">
                    <img src="${globalUserAvatar}" class="w-7 h-7 rounded-full object-cover">
                    <input type="text" id="comment-input-${postId}" placeholder="Add a comment..." class="bg-transparent flex-grow text-sm text-white focus:outline-none placeholder-slate-500" onclick="checkAuthBeforeAction()">
                    <button onclick="submitComment('${postId}')" class="text-rose-500 font-bold text-sm hover:text-white transition-colors focus:outline-none">Post</button>
                </div>

            </div>
          `;
          blogContainer.appendChild(postElement);
        });
        feather.replace();
      } catch (error) {
        console.log("Error loading posts:", error);
      }
    }

    // Auth Check Helper
    window.checkAuthBeforeAction = function() {
        if (!globalUserEmail) {
            window.location.href = 'login.html?return=blog.html';
            return false;
        }
        return true;
    }

    // Toggle Single Like (One User = One Like)
    window.toggleLike = async function(postId) {
        if (!checkAuthBeforeAction()) return;

        const state = window.postLikesState[postId];
        const hasLiked = state.likedBy.includes(globalUserEmail);
        const postRef = doc(db, "blogPosts", postId);
        
        const heartIcon = document.getElementById(`heart-icon-${postId}`);
        const likeCount = document.getElementById(`like-count-${postId}`);

        try {
            if (hasLiked) {
                // Remove Like
                await updateDoc(postRef, { likedBy: arrayRemove(globalUserEmail) });
                state.likedBy = state.likedBy.filter(e => e !== globalUserEmail);
                
                // Update UI visually
                heartIcon.setAttribute('fill', 'none');
                heartIcon.setAttribute('color', 'currentColor');
                heartIcon.classList.remove('text-rose-500');
                heartIcon.classList.add('text-white');
            } else {
                // Add Like
                await updateDoc(postRef, { likedBy: arrayUnion(globalUserEmail) });
                state.likedBy.push(globalUserEmail);
                
                // Update UI visually
                heartIcon.setAttribute('fill', '#f43f5e'); 
                heartIcon.setAttribute('color', '#f43f5e');
                heartIcon.classList.remove('text-white');
                heartIcon.classList.add('text-rose-500');
            }
            likeCount.innerText = `${state.likedBy.length} likes`;
        } catch (error) {
            console.error("Error updating like:", error);
        }
    }

    // Toggle Comments visibility
    window.toggleComments = function(postId) {
        const section = document.getElementById(`comment-section-${postId}`);
        section.classList.toggle('hidden');
        section.classList.toggle('flex');
    }

    // Submit Comment
    window.submitComment = async function(postId) {
        if (!checkAuthBeforeAction()) return;

        const inputField = document.getElementById(`comment-input-${postId}`);
        const text = inputField.value.trim();
        if (!text) return;

        inputField.value = ''; 
        let displayName = globalUserEmail.includes('@') ? globalUserEmail.split('@')[0] : "User_" + globalUserEmail.substring(globalUserEmail.length - 4);

        const newComment = {
            user: displayName, 
            text: text,
            date: new Date().toLocaleDateString()
        };

        const list = document.getElementById(`comment-section-${postId}`);
        list.classList.remove('hidden');
        list.classList.add('flex');
        
        if(list.innerText.includes('No comments yet')) list.innerHTML = '';
        list.innerHTML += `
             <div class="mb-1 text-sm leading-tight">
                <span class="font-bold text-white mr-1">${newComment.user}</span>
                <span class="text-slate-200">${newComment.text}</span>
             </div>
        `;
        list.scrollTop = list.scrollHeight; // Auto scroll to bottom

        try {
            const postRef = doc(db, "blogPosts", postId);
            await updateDoc(postRef, {
                comments: arrayUnion(newComment)
            });
        } catch (error) {
            console.error("Error posting comment: ", error);
        }
    }

    // Delete Single Post (Admin Only)
    window.deleteSinglePost = async function(postId) {
        if (!isAdmin) return;
        
        if (confirm("Are you SURE you want to delete this specific post? This cannot be undone.")) {
            try {
                await deleteDoc(doc(db, "blogPosts", postId));
                alert("Post deleted successfully.");
                loadFullBlogPosts(); // Reload feed
            } catch (error) {
                alert("Failed to delete post: " + error.message);
            }
        }
    }

  </script>
</body>
</html>
