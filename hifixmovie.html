<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>CINEHUB — Movie & TV Discovery</title>
<style>
:root{
  --bg:#07070a;--panel:#111116;--panel2:#17171e;--text:#f7f7f8;--muted:#a6a6b0;
  --line:rgba(255,255,255,.09);--accent:#e50935;--accent2:#ff3158;
  --shadow:0 20px 60px rgba(0,0,0,.45);--radius:18px
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(229,9,53,.16),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}.container{width:min(1400px,calc(100% - 36px));margin:auto}
header{position:fixed;inset:0 0 auto;z-index:50;height:76px;display:flex;align-items:center;background:linear-gradient(to bottom,rgba(4,4,7,.94),rgba(4,4,7,.45));backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:.25s}
header.scrolled{background:rgba(7,7,10,.94);border-color:var(--line)}
.nav{display:flex;align-items:center;gap:28px;width:100%}.logo{font-weight:950;letter-spacing:-1px;font-size:24px}.logo span{color:var(--accent)}
.navlinks{display:flex;gap:20px;align-items:center}.navlinks a{color:#ddd;text-decoration:none;font-size:14px}.navlinks a:hover{color:#fff}
.spacer{flex:1}.iconbtn{background:transparent;color:#eee;font-size:20px;padding:8px;border-radius:12px}.iconbtn:hover{background:rgba(255,255,255,.08)}
.searchbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid var(--line);padding:8px 12px;border-radius:14px}.searchbox input{width:180px;background:transparent;border:0;outline:0;color:white}
.hero{min-height:720px;display:flex;align-items:end;padding:130px 0 70px;position:relative;overflow:hidden;background:#09090c}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#07070a 0%,rgba(7,7,10,.88) 35%,rgba(7,7,10,.25) 75%,#07070a 100%),linear-gradient(0deg,#07070a 0%,transparent 50%,rgba(0,0,0,.35) 100%);z-index:1}
.hero-bg{position:absolute;inset:0;background-position:center;background-size:cover;opacity:.72;filter:saturate(.9)}
.hero-content{position:relative;z-index:2;width:min(760px,100%)}.eyebrow{color:#ff6b86;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(42px,6vw,84px);line-height:.96;letter-spacing:-3px;margin:14px 0}.hero p{font-size:17px;line-height:1.65;color:#d4d4d9;max-width:700px}.meta{display:flex;flex-wrap:wrap;gap:9px;align-items:center;color:#ddd;font-size:14px;margin:18px 0}.badge{padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.06)}
.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{padding:12px 18px;border-radius:12px;font-weight:800}.primary{background:var(--accent);color:white}.primary:hover{background:var(--accent2)}.secondary{background:rgba(255,255,255,.09);color:white;border:1px solid var(--line)}
main{padding:50px 0}.section{margin:0 0 48px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.section h2{font-size:26px;margin:0}.section small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.card{min-width:0;position:relative}.poster{aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:#15151b;position:relative;border:1px solid var(--line)}.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:.35s}.card:hover img{transform:scale(1.05)}.overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.92),transparent 55%);opacity:0;transition:.25s;display:flex;align-items:end;padding:12px}.card:hover .overlay{opacity:1}.quick{display:flex;gap:7px}.quick button{width:36px;height:36px;border-radius:50%;background:white;color:#111;font-weight:900}.title{font-weight:750;margin:9px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.035);border:1px solid var(--line);padding:14px;border-radius:16px;margin-bottom:22px}.toolbar input,.toolbar select{background:#15151b;color:white;border:1px solid var(--line);padding:10px 12px;border-radius:10px;outline:0}
.empty,.error{padding:55px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.error{color:#ff9aae}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modalbox{width:min(1000px,100%);max-height:90vh;overflow:auto;background:#111116;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}.modalbody{padding:20px}.detail{display:grid;grid-template-columns:250px 1fr;gap:24px}.detail img{width:100%;border-radius:14px}.detail h2{font-size:38px;margin:0 0 8px}.detail p{color:#ccc;line-height:1.65}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{font-size:12px;background:rgba(255,255,255,.07);padding:6px 9px;border-radius:8px;color:#ddd}
.trailer{position:relative;aspect-ratio:16/9;background:#000}.trailer iframe{width:100%;height:100%;border:0}.close{background:rgba(255,255,255,.08);color:#fff;border-radius:10px;width:38px;height:38px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(380px,92vw);background:#101015;z-index:90;transform:translateX(105%);transition:.25s;padding:88px 22px 22px;border-left:1px solid var(--line);overflow:auto}.drawer.open{transform:none}.drawer h3{margin-top:0}.field{margin:15px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.field input,.field select{width:100%;background:#17171e;color:#fff;border:1px solid var(--line);padding:11px;border-radius:10px}
footer{border-top:1px solid var(--line);padding:40px 0;color:var(--muted);font-size:13px}
.skeleton{background:linear-gradient(100deg,#121218 20%,#1d1d24 40%,#121218 60%);background-size:200% 100%;animation:shine 1.2s infinite}@keyframes shine{to{background-position:-200% 0}}
@media(max-width:1100px){.grid{grid-template-columns:repeat(5,1fr)}.navlinks{display:none}}
@media(max-width:800px){.grid{grid-template-columns:repeat(4,1fr)}.hero{min-height:650px}.searchbox input{width:110px}.detail{grid-template-columns:150px 1fr}}
@media(max-width:560px){.container{width:min(100% - 24px,1400px)}header{height:66px}.searchbox{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.hero{min-height:620px;padding-bottom:42px}h1{font-size:44px;letter-spacing:-2px}.hero p{font-size:15px}.detail{grid-template-columns:1fr}.detail img{max-width:220px}.modal{padding:8px}.modalbox{max-height:94vh}}
</style>
</head>
<body>
<header id="header"><div class="container nav">
  <a href="#/" class="logo" style="color:white;text-decoration:none">CINE<span>HUB</span></a>
  <nav class="navlinks">
    <a href="#/">Home</a><a href="#/movies">Movies</a><a href="#/tv">TV Shows</a>
    <a href="#/trending">Trending</a><a href="#/top-rated">Top Rated</a><a href="#/genres">Genres</a><a href="#/countries">Countries</a>
  </nav>
  <div class="spacer"></div>
  <form class="searchbox" id="headerSearch"><span>⌕</span><input id="headerSearchInput" placeholder="Search movies & TV" aria-label="Search"></form>
  <button class="iconbtn" id="watchBtn" title="Watchlist">♡</button>
  <button class="iconbtn" id="menuBtn" title="Menu">☰</button>
</div></header>

<section class="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="container"><div class="hero-content" id="heroContent">
    <div class="eyebrow">CINEHUB • DISCOVER</div><h1>Find your next story.</h1>
    <p>Discover movies and TV shows using your live metadata API.</p>
    <div class="actions"><button class="primary" id="heroSearchBtn">EXPLORE MOVIES</button></div>
  </div></div>
</section>

<main class="container" id="app"></main>

<div class="drawer" id="drawer">
  <button class="close" id="drawerClose">×</button><h3>Filters</h3>
  <div class="field"><label>Type</label><select id="fType"><option value="">All types</option></select></div>
  <div class="field"><label>Genre</label><select id="fGenre"><option value="">All genres</option></select></div>
  <div class="field"><label>Country</label><select id="fCountry"><option value="">All countries</option></select></div>
  <div class="field"><label>Language</label><select id="fLanguage"><option value="">All languages</option></select></div>
  <div class="field"><label>Content Rating</label><select id="fRating"><option value="">All ratings</option></select></div>
  <div class="field"><label>Minimum rating</label><input id="fMinRating" type="number" min="0" max="10" step=".1" placeholder="0"></div>
  <button class="primary" id="applyFilters" style="width:100%">Apply Filters</button>
</div>

<div class="modal" id="modal"><div class="modalbox">
  <div class="modalhead"><strong id="modalTitle">CINEHUB</strong><button class="close" id="modalClose">×</button></div>
  <div class="modalbody" id="modalBody"></div>
</div></div>

<footer><div class="container">CINEHUB — Movie & TV Discovery. Metadata is supplied by the configured API. CINEHUB is not affiliated with IMDb.</div></footer>

<script>
/*
  ============================================================
  CINEHUB API CONFIG
  ============================================================
  The supplied credentials/identifiers:
    API ID:      api_d92f85b9-d095-4deb-bf92-2af12d5410db
    API Version: apiversion_0b731677-4f03-4850-b4c2-b9a954b6c4ff

  IMPORTANT:
  The supplied reference does not contain a concrete public BASE_URL
  or documented endpoint paths, so this file does NOT invent them.
  Put the real API base URL/path in BASE_URL below.
*/
const API_CONFIG = {
  // RapidAPI host confirmed by your API details.
  HOST: "imdb236.p.rapidapi.com",

  // IMPORTANT: replace this with YOUR RapidAPI key.
  // Do not publish a real key in a public frontend.
  RAPIDAPI_KEY: "b51d957631mshcc2d2fe52917d48p1a318ajsna4f6330c9e9",

  // These identify your RapidAPI API/version in the platform.
  // They are metadata identifiers, not substitutes for X-RapidAPI-Key.
  API_ID: "api_d92f85b9-d095-4deb-bf92-2af12d5410db",
  API_VERSION_ID: "apiversion_0b731677-4f03-4850-b4c2-b9a954b6c4ff",

  BASE_URL: "https://imdb236.p.rapidapi.com"
};

const API = {
  async request(path="", params={}) {
    if (!API_CONFIG.RAPIDAPI_KEY) {
      throw new Error("RAPIDAPI_KEY_MISSING");
    }

    const url = new URL(API_CONFIG.BASE_URL + path);
    Object.entries(params).forEach(([k,v]) => {
      if (v !== "" && v !== null && v !== undefined) {
        url.searchParams.set(k, v);
      }
    });

    const res = await fetch(url.toString(), {
      method: "GET",
      headers: {
        "X-RapidAPI-Key": API_CONFIG.RAPIDAPI_KEY,
        "X-RapidAPI-Host": API_CONFIG.HOST,
        "Accept": "application/json"
      }
    });

    if (!res.ok) {
      const text = await res.text().catch(() => "");
      throw new Error(`RAPIDAPI_HTTP_${res.status}${text ? " " + text.slice(0,120) : ""}`);
    }
    return res.json();
  },

  // Confirmed RapidAPI IMDb endpoints.
  search(params={}) {
    return this.request("/api/imdb/search", params);
  },

  autocomplete(query) {\n    return this.request("/api/imdb/autocomplete", { query });\n  },\n\n  title(id) {
    return this.request("/api/imdb/" + encodeURIComponent(id));
  },

  // Useful IMDb lists exposed by this API.
  top250Movies() {
    return this.request("/api/imdb/top250-movies");
  },

  top250TVShows() {
    return this.request("/api/imdb/top250-tv-shows");
  },

  mostPopularMovies() {
    return this.request("/api/imdb/most-popular-movies");
  },

  mostPopularTVShows() {
    return this.request("/api/imdb/most-popular-tv-shows");
  },

  topRatedEnglishMovies() {
    return this.request("/api/imdb/top-rated-english-movies");
  },

  lowestRatedMovies() {
    return this.request("/api/imdb/lowest-rated-movies");
  }
};

const FALLBACK_GENRES = ["Drama","Documentary","Comedy","Action","Romance","Thriller","Crime","Horror","Music","Adventure","Family","Animation","Reality-TV","Mystery","History","Biography","Sport","Talk-Show","Fantasy","Sci-Fi","Musical","News","War","Adult","Game-Show","Western","Short","Film-Noir"];
const FALLBACK_TYPES = ["movie","tvSeries","tvMovie","tvMiniSeries","tvSpecial"];

const state = { results:[], total:0, query:"", page:1, rows:24, filters:{}, initialized:false };

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
const first = v => Array.isArray(v) ? v[0] : v;

function normalize(x){
  return {
    id:x.id || x.imdbId || x.tconst || "",
    title:x.primaryTitle || x.title || x.originalTitle || "Untitled",
    originalTitle:x.originalTitle || "",
    type:x.type || "",
    description:x.description || "",
    image:x.primaryImage || first(x.thumbnails)?.url || "",
    thumbnails:arr(x.thumbnails),
    trailer:x.trailer || "",
    contentRating:x.contentRating || "",
    year:x.startYear || "",
    endYear:x.endYear || "",
    releaseDate:x.releaseDate || "",
    genres:arr(x.genres),
    interests:arr(x.interests),
    countries:arr(x.countriesOfOrigin),
    languages:arr(x.spokenLanguages),
    filmingLocations:arr(x.filmingLocations),
    productionCompanies:arr(x.productionCompanies),
    budget:x.budget,
    grossWorldwide:x.grossWorldwide,
    isAdult:!!x.isAdult,
    runtime:x.runtimeMinutes,
    rating:x.averageRating,
    votes:x.numVotes,
    metascore:x.metascore,
    externalLinks:arr(x.externalLinks),
    url:x.url || ""
  };
}

function resultArray(data){
  if(Array.isArray(data)) return data;
  if(Array.isArray(data.results)) return data.results;
  if(Array.isArray(data.data)) return data.data;
  if(Array.isArray(data.items)) return data.items;
  return [];
}

function imageFallback(img){
  img.onerror = () => {
    img.onerror = null;
    img.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900"><rect width="100%" height="100%" fill="#15151b"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#777" font-size="28" font-family="Arial">CINEHUB</text></svg>'
    );
  };
}

function card(m){
  const saved = watchlist().includes(m.id);
  return `<article class="card">
    <div class="poster">
      <img src="${esc(m.image)}" alt="${esc(m.title)}" loading="lazy" onerror="imageFallback(this)">
      <div class="overlay"><div class="quick">
        <button onclick="openDetails('${esc(m.id)}')" title="Details">i</button>
        ${m.trailer ? `<button onclick="openTrailer('${esc(m.trailer)}')" title="Trailer">▶</button>` : ""}
        <button onclick="toggleWatch('${esc(m.id)}')" title="Watchlist">${saved?"♥":"♡"}</button>
      </div></div>
    </div>
    <div class="title">${esc(m.title)}</div>
    <div class="sub">${esc(m.year || "—")} ${m.rating!=null ? " • ★ "+esc(m.rating) : ""}</div>
  </article>`;
}

function section(title, items){
  if(!items.length) return "";
  return `<section class="section"><div class="section-head"><div><h2>${esc(title)}</h2><small>${items.length} titles</small></div><button class="secondary" onclick="location.hash='#/search'">See all</button></div><div class="grid">${items.map(card).join("")}</div></section>`;
}

function skeletons(n=12){
  return `<div class="grid">${Array.from({length:n},()=>`<div><div class="poster skeleton"></div><div class="skeleton" style="height:15px;margin-top:9px;border-radius:6px"></div></div>`).join("")}</div>`;
}

function watchlist(){
  try{return JSON.parse(localStorage.getItem("cinehub_watchlist")||"[]")}catch{return[]}
}
function toggleWatch(id){
  if(!id)return;
  let w=watchlist();
  w=w.includes(id)?w.filter(x=>x!==id):[id,...w];
  localStorage.setItem("cinehub_watchlist",JSON.stringify(w));
  route();
}

function youtube(url){
  try{
    const u=new URL(url);
    let id=u.searchParams.get("v");
    if(!id && u.hostname.includes("youtu.be")) id=u.pathname.slice(1);
    return id ? "https://www.youtube.com/embed/"+encodeURIComponent(id)+"?autoplay=1&rel=0" : "";
  }catch{return ""}
}

function openTrailer(url){
  const src=youtube(url);
  if(!src){ alert("No supported YouTube trailer URL."); return; }
  $("#modalTitle").textContent="Trailer";
  $("#modalBody").innerHTML=`<div class="trailer"><iframe src="${src}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>`;
  $("#modal").classList.add("open"); document.body.style.overflow="hidden";
}

async function openDetails(id){
  if(!id)return;
  $("#modalTitle").textContent="Loading…";
  $("#modalBody").innerHTML=skeletons(1);
  $("#modal").classList.add("open"); document.body.style.overflow="hidden";
  try{
    let data=await API.title(id);
    let m=normalize(data.result || data.data || data);
    if(!m.id)m.id=id;
    renderDetails(m);
  }catch(e){
    $("#modalBody").innerHTML=`<div class="error">Unable to load details. Check your API endpoint configuration.</div>`;
  }
}

function renderDetails(m){
  $("#modalTitle").textContent=m.title;
  const genres=m.genres.map(x=>`<span class="chip">${esc(typeof x==="object"?x.name:x)}</span>`).join("");
  const countries=m.countries.map(x=>`<span class="chip">${esc(typeof x==="object"?(x.name||x.iso_3166_1):x)}</span>`).join("");
  const companies=m.productionCompanies.map(x=>`<span class="chip">${esc(typeof x==="object"?x.name:x)}</span>`).join("");
  $("#modalBody").innerHTML=`<div class="detail">
    <div>${m.image?`<img src="${esc(m.image)}" alt="${esc(m.title)}" onerror="imageFallback(this)">`:""}</div>
    <div>
      <div class="eyebrow">${esc(m.type)}</div>
      <h2>${esc(m.title)}</h2>
      ${m.originalTitle&&m.originalTitle!==m.title?`<div class="sub">${esc(m.originalTitle)}</div>`:""}
      <div class="meta">
        ${m.year?`<span class="badge">${esc(m.year)}</span>`:""}
        ${m.runtime?`<span class="badge">${esc(m.runtime)} min</span>`:""}
        ${m.contentRating?`<span class="badge">${esc(m.contentRating)}</span>`:""}
        ${m.rating!=null?`<span class="badge">★ ${esc(m.rating)}</span>`:""}
        ${m.votes!=null?`<span class="badge">${esc(m.votes)} votes</span>`:""}
        ${m.metascore!=null?`<span class="badge">Metascore ${esc(m.metascore)}</span>`:""}
      </div>
      ${m.description?`<p>${esc(m.description)}</p>`:""}
      ${genres?`<div class="chips">${genres}</div>`:""}
      ${countries?`<p><b>Countries</b></p><div class="chips">${countries}</div>`:""}
      ${m.languages.length?`<p><b>Languages:</b> ${esc(m.languages.join(", "))}</p>`:""}
      ${companies?`<p><b>Production</b></p><div class="chips">${companies}</div>`:""}
      ${m.releaseDate?`<p><b>Release:</b> ${esc(m.releaseDate)}</p>`:""}
      ${m.budget!=null?`<p><b>Budget:</b> ${esc(formatMoney(m.budget))}</p>`:""}
      ${m.grossWorldwide!=null?`<p><b>Worldwide Gross:</b> ${esc(formatMoney(m.grossWorldwide))}</p>`:""}
      <div class="actions">
        ${m.trailer?`<button class="primary" onclick="openTrailer('${esc(m.trailer)}')">WATCH TRAILER</button>`:""}
        <button class="secondary" onclick="toggleWatch('${esc(m.id)}')">${watchlist().includes(m.id)?"REMOVE FROM WATCHLIST":"ADD TO WATCHLIST"}</button>
      </div>
    </div>
  </div>`;
}

function formatMoney(v){
  if(typeof v==="number") return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(v);
  return v;
}

async function loadMeta(){
  const cacheKey="cinehub_meta_v1";
  try{
    const cached=JSON.parse(localStorage.getItem(cacheKey)||"null");
    if(cached && Date.now()-cached.time<86400000){fillMeta(cached);return}
  }catch{}
  const meta={types:FALLBACK_TYPES,genres:FALLBACK_GENRES,countries:[],languages:[],ratings:[]};
  if(API_CONFIG.BASE_URL){
    const jobs=await Promise.allSettled([API.types(),API.genres(),API.countries(),API.languages(),API.contentRatings()]);
    const vals=jobs.map(x=>x.status==="fulfilled"?resultArray(x.value):[]);
    if(vals[0].length)meta.types=vals[0].map(x=>typeof x==="object"?(x.value||x.name||x.id):x);
    if(vals[1].length)meta.genres=vals[1].map(x=>typeof x==="object"?(x.name||x.value):x);
    if(vals[2].length)meta.countries=vals[2];
    if(vals[3].length)meta.languages=vals[3];
    if(vals[4].length)meta.ratings=vals[4].map(x=>typeof x==="object"?(x.name||x.value):x);
  }
  meta.time=Date.now(); try{localStorage.setItem(cacheKey,JSON.stringify(meta))}catch{}
  fillMeta(meta);
}
function fillMeta(m){
  const fill=(sel,items,labelFn)=>{
    const el=$(sel); if(!el)return;
    const first=el.options[0]?.outerHTML||"";
    el.innerHTML=first+items.slice(0,500).map(x=>`<option value="${esc(typeof x==="object"?(x.iso_3166_1||x.code||x.value||x.name):x)}">${esc(labelFn?labelFn(x):typeof x==="object"?(x.name||x.value||x.code):x)}</option>`).join("");
  };
  fill("#fType",m.types);fill("#fGenre",m.genres);fill("#fCountry",m.countries);fill("#fLanguage",m.languages);fill("#fRating",m.ratings);
}

function paramsFromFilters(){
  const f=state.filters, p={};
  if(state.query)p.q=state.query;
  if(f.type)p.type=f.type;
  if(f.genre)p.genre=f.genre;
  if(f.country)p.country=f.country;
  if(f.language)p.language=f.language;
  if(f.rating)p.contentRating=f.rating;
  if(f.minRating)p.minRating=f.minRating;
  // These are conventional UI params; if your API documentation uses different
  // pagination names, change only these names to the exact documented parameters.
  p.rows=state.rows;
  p.sortOrder="DESC";
  p.sortField="averageRating";
  return p;
}

async function searchAPI(){
  if(!API_CONFIG.RAPIDAPI_KEY){
    return {error:"RAPIDAPI_KEY_MISSING",results:[],numFound:0};
  }
  try{
    const data=await API.search(paramsFromFilters());
    return {results:resultArray(data).map(normalize),numFound:Number(data.numFound ?? data.total ?? resultArray(data).length)||0,rows:Number(data.rows ?? state.rows)||state.rows};
  }catch(e){return {error:e.message,results:[],numFound:0}}
}

async function renderHome(){
  $("#app").innerHTML=skeletons(12);
  if(!API_CONFIG.BASE_URL){
    $("#app").innerHTML=`<div class="error"><b>RapidAPI key is not configured.</b><br><br>Open this file and set <code>API_CONFIG.RAPIDAPI_KEY</code> to your RapidAPI key. The RapidAPI Host, API ID and API Version ID are already configured.</div>`;
    return;
  }
  const r=await searchAPI();
  if(r.error){$("#app").innerHTML=`<div class="error">Unable to load movies. API error: ${esc(r.error)}</div>`;return}
  state.results=r.results;state.total=r.numFound;
  const movies=r.results.filter(x=>x.type==="movie");
  const tv=r.results.filter(x=>x.type!=="movie");
  if(r.results[0])setHero(r.results[0]);
  $("#app").innerHTML=section("🔥 Trending Now",r.results.slice(0,6))
    +section("Popular Movies",movies.slice(0,6))
    +section("Popular TV Shows",tv.slice(0,6))
    +section("⭐ Top Rated",[...r.results].sort((a,b)=>(b.rating??-1)-(a.rating??-1)).slice(0,6))
    +section("Latest Releases",[...r.results].sort((a,b)=>String(b.releaseDate).localeCompare(String(a.releaseDate))).slice(0,6));
}

function setHero(m){
  $("#heroBg").style.backgroundImage=m.image?`url("${m.image.replace(/"/g,'\\"')}")`:"";
  $("#heroContent").innerHTML=`<div class="eyebrow">FEATURED • ${esc(m.type)}</div>
    <h1>${esc(m.title)}</h1>
    <div class="meta">${m.year?`<span class="badge">${esc(m.year)}</span>`:""}${m.rating!=null?`<span class="badge">★ ${esc(m.rating)}</span>`:""}${m.contentRating?`<span class="badge">${esc(m.contentRating)}</span>`:""}${m.runtime?`<span class="badge">${esc(m.runtime)} min</span>`:""}</div>
    <p>${esc(m.description||"Discover more details about this title.")}</p>
    <div class="actions">
      ${m.trailer?`<button class="primary" onclick="openTrailer('${esc(m.trailer)}')">▶ WATCH TRAILER</button>`:""}
      <button class="secondary" onclick="openDetails('${esc(m.id)}')">MORE DETAILS</button>
      <button class="secondary" onclick="toggleWatch('${esc(m.id)}')">${watchlist().includes(m.id)?"♥ SAVED":"♡ WATCHLIST"}</button>
    </div>`;
}

async function renderListing(title, extraFilters={}){
  $("#app").innerHTML=`<section class="section"><div class="section-head"><div><h2>${esc(title)}</h2><small id="resultCount">Loading…</small></div><button class="secondary" id="filterOpen">Filters</button></div>
  <div class="toolbar"><input id="pageSearch" placeholder="Search this collection…" value="${esc(state.query)}"><select id="sort"><option value="default">Default</option><option value="rating">Rating high → low</option><option value="newest">Newest</option><option value="az">A → Z</option><option value="votes">Most voted</option></select></div>
  <div id="listing">${skeletons(12)}</div></section>`;
  $("#filterOpen").onclick=()=>$("#drawer").classList.add("open");
  $("#pageSearch").onkeydown=e=>{if(e.key==="Enter"){state.query=e.target.value.trim();state.page=1;route()}};
  const r=await searchAPI();
  if(r.error){$("#listing").innerHTML=`<div class="error">Unable to load data. Set <code>API_CONFIG.RAPIDAPI_KEY</code> first.</div>`;return}
  let items=r.results;
  if(extraFilters.type)items=items.filter(x=>x.type===extraFilters.type);
  if(extraFilters.genre)items=items.filter(x=>x.genres.includes(extraFilters.genre));
  const sort=$("#sort");
  sort.onchange=()=>{const v=sort.value;items=[...items];if(v==="rating")items.sort((a,b)=>(b.rating??-1)-(a.rating??-1));if(v==="newest")items.sort((a,b)=>String(b.releaseDate).localeCompare(String(a.releaseDate)));if(v==="az")items.sort((a,b)=>a.title.localeCompare(b.title));if(v==="votes")items.sort((a,b)=>(b.votes??-1)-(a.votes??-1));$("#listing").innerHTML=items.length?`<div class="grid">${items.map(card).join("")}</div>`:`<div class="empty">No results found.</div>`};
  $("#resultCount").textContent=`${r.numFound.toLocaleString()} results`;
  $("#listing").innerHTML=items.length?`<div class="grid">${items.map(card).join("")}</div>`:`<div class="empty">No results found.</div>`;
}

async function renderSearch(){
  await renderListing(state.query?`Search: ${state.query}`:"Search Movies & TV");
}

async function renderWatchlist(){
  const ids=watchlist();
  $("#app").innerHTML=`<section class="section"><div class="section-head"><div><h2>♡ Your Watchlist</h2><small>${ids.length} saved</small></div>${ids.length?`<button class="secondary" onclick="localStorage.removeItem('cinehub_watchlist');route()">Clear all</button>`:""}</div><div id="watchArea">${ids.length?skeletons(ids.length):`<div class="empty">Your watchlist is empty.<br><br>Add titles from any movie card.</div>`}</div></section>`;
  if(!ids.length)return;
  if(!API_CONFIG.BASE_URL){$("#watchArea").innerHTML=`<div class="error">Connect the API to load saved titles.</div>`;return}
  const got=await Promise.allSettled(ids.map(id=>API.title(id)));
  const items=got.filter(x=>x.status==="fulfilled").map(x=>normalize(x.value.result||x.value.data||x.value)).filter(x=>x.id);
  $("#watchArea").innerHTML=items.length?`<div class="grid">${items.map(card).join("")}</div>`:`<div class="empty">Saved titles could not be loaded.</div>`;
}

function route(){
  const hash=location.hash||"#/";
  const path=hash.replace(/^#/,"");
  const q=new URLSearchParams(location.search).get("q") || (path.startsWith("/search")?new URLSearchParams(path.split("?")[1]||"").get("q"):"");
  state.query=q||"";
  if(path==="/"||path==="")renderHome();
  else if(path.startsWith("/search"))renderSearch();
  else if(path==="/watchlist"){renderWatchlist()}
  else if(path==="/movies")renderListing("Movies",{type:"movie"});
  else if(path==="/tv")renderListing("TV Shows",{type:"tvSeries"});
  else if(path==="/trending")renderListing("Trending Now");
  else if(path==="/top-rated")renderListing("Top Rated");
  else if(path==="/latest")renderListing("Latest Releases");
  else if(path.startsWith("/genre/"))renderListing(path.split("/")[2].replace(/-/g," "),{genre:path.split("/")[2]});
  else renderHome();
}

$("#headerSearch").addEventListener("submit",e=>{e.preventDefault();const q=$("#headerSearchInput").value.trim();location.hash="/search";history.replaceState(null,"","?q="+encodeURIComponent(q));route()});
$("#watchBtn").onclick=()=>location.hash="/watchlist";
$("#menuBtn").onclick=()=>$("#drawer").classList.add("open");
$("#drawerClose").onclick=()=>$("#drawer").classList.remove("open");
$("#modalClose").onclick=()=>{$("#modal").classList.remove("open");$("#modalBody").innerHTML="";document.body.style.overflow=""};
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")$("#modalClose").click()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#modal").classList.contains("open"))$("#modalClose").click();$("#drawer").classList.remove("open")}});
$("#applyFilters").onclick=()=>{state.filters={type:$("#fType").value,genre:$("#fGenre").value,country:$("#fCountry").value,language:$("#fLanguage").value,rating:$("#fRating").value,minRating:$("#fMinRating").value};state.page=1;$("#drawer").classList.remove("open");route()};
$("#heroSearchBtn").onclick=()=>{location.hash="/movies"};
window.addEventListener("hashchange",route);window.addEventListener("scroll",()=>$("#header").classList.toggle("scrolled",scrollY>20));

loadMeta();
route();
</script>
