<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMDb - The Home of Movies</title>
    <style>
        :root {
            --bg-color: #121212;
            --nav-bg: #1f1f1f;
            --primary-color: #f5c518;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-light); }
        
        /* Navbar */
        header { display: flex; justify-content: space-between; align-items: center; background-color: var(--nav-bg); padding: 15px 50px; }
        .logo { font-size: 28px; font-weight: bold; background-color: var(--primary-color); color: #000; padding: 5px 10px; border-radius: 5px; }
        .search-bar { display: flex; gap: 10px; width: 50%; }
        .search-bar input { width: 100%; padding: 10px; border: none; border-radius: 4px; }
        .search-bar select { padding: 10px; border: none; border-radius: 4px; background: #333; color: white; }

        /* Hero Section (Amateur Hawa) */
        .hero { display: flex; padding: 50px; gap: 30px; background: linear-gradient(to right, #000000, transparent), url('https://m.media-amazon.com/images/M/MV5BM2YzYWZjZWQtYWNlNi00MTJjLWE4MTUtOWMwODA2MTAxZDQ1XkEyXkFqcGc@.jpg') no-repeat center/cover; height: 500px; align-items: center; }
        .hero-content { max-width: 600px; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; }
        .hero h1 { font-size: 48px; color: var(--primary-color); margin-bottom: 10px; }
        .tags span { display: inline-block; background: #333; padding: 5px 10px; border-radius: 20px; font-size: 14px; margin-right: 10px; margin-bottom: 15px; }
        .hero p { line-height: 1.6; font-size: 16px; margin-bottom: 20px; }

        /* Movie Grid */
        .section-title { padding: 40px 50px 20px; font-size: 24px; border-left: 5px solid var(--primary-color); margin-left: 50px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 0 50px 50px; }
        .movie-card { background-color: var(--nav-bg); border-radius: 8px; overflow: hidden; transition: transform 0.3s; }
        .movie-card:hover { transform: scale(1.05); }
        .movie-card img { width: 100%; height: 300px; object-fit: cover; }
        .movie-info { padding: 15px; }
        .movie-info h3 { font-size: 16px; margin-bottom: 5px; }
        .rating { color: var(--primary-color); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">HMDb</div>
        <div class="search-bar">
            <select id="genre-select">
                <option value="All">All Genres</option>
                <option value="Drama">Drama</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Thriller">Thriller</option>
            </select>
            <input type="text" placeholder="Search movies, TV series... (e.g., Breaking Bad)">
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Amateur Hawa</h1>
            <div class="tags">
                <span>Action</span>
                <span>Comedy</span>
                <span>Drama</span>
                <span>2025</span>
            </div>
            <p>In a desperate attempt to save his life, inexperienced Victor drags his friends into a botched bank truck heist with a local thug, spiraling into a chaotic and hilarious chase as their plans unravel.</p>
        </div>
    </section>

    <h2 class="section-title">Top 250 Movies</h2>
    <section class="movie-grid" id="movie-container">
        <!-- Movies will be injected here by JS -->
    </section>

    <script>
        // Sample data from your JSON
        const topMovies = [
            {
                title: "The Shawshank Redemption",
                year: 1994,
                rating: 9.3,
                image: "https://m.media-amazon.com/images/M/MV5BMDAyY2FhYjctNDc5OS00MDNlLThiMGUtY2UxYWVkNGY2ZjljXkEyXkFqcGc@._V1_QL75_UX280_CR0,0,280,414_.jpg"
            },
            {
                title: "The Godfather",
                year: 1972,
                rating: 9.2,
                image: "https://m.media-amazon.com/images/M/MV5BNGEwYjgwOGQtYjg5ZS00Njc1LTk2ZGEtM2QwZWQ2NjdhZTE5XkEyXkFqcGc@._V1_QL75_UX280_CR0,0,280,414_.jpg"
            },
            {
                title: "The Dark Knight",
                year: 2008,
                rating: 9.1,
                image: "https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_QL75_UX280_CR0,0,280,414_.jpg"
            },
            {
                title: "The Lord of the Rings",
                year: 2003,
                rating: 9.0,
                image: "https://m.media-amazon.com/images/M/MV5BMTZkMjBjNWMtZGI5OC00MGU0LTk4ZTItODg2NWM3NTVmNWQ4XkEyXkFqcGc@._V1_QL75_UX280_CR0,0,280,414_.jpg"
            },
            {
                title: "12 Angry Men",
                year: 1957,
                rating: 9.0,
                image: "https://m.media-amazon.com/images/M/MV5BYjE4NzdmOTYtYjc5Yi00YzBiLWEzNDEtNTgxZGQ2MWVkN2NiXkEyXkFqcGc@._V1_QL75_UX280_CR0,0,280,414_.jpg"
            }
        ];

        const container = document.getElementById('movie-container');

        topMovies.forEach(movie => {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <img src="${movie.image}" alt="${movie.title}">
                <div class="movie-info">
                    <h3>${movie.title} (${movie.year})</h3>
                    <p class="rating">⭐ ${movie.rating}</p>
                </div>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
