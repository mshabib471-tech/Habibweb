<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMBD - Movies & Shows</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
        }

        header {
            background-color: #141414;
            padding: 20px 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .logo {
            color: #e50914; 
            font-size: 32px;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 24px;
            border-left: 5px solid #e50914;
            padding-left: 10px;
            margin-top: 20px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .movie-card {
            background-color: #1f1f1f;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.4); /* Red glow effect on hover */
        }

        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-rating {
            color: #f5c518; 
            font-weight: bold;
            font-size: 14px;
        }

        /* Load More Button Styling */
        .load-more-container {
            text-align: center;
            margin: 40px 0;
        }

        .load-more-btn {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .load-more-btn:hover {
            background-color: #b8070f;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">HMBD MOVIES</a>
    </header>

    <div class="container">
        <h2 class="section-title">Trending Popular Movies</h2>
        
        <div class="movie-grid" id="movie-grid">
            <!-- Movies will be injected here -->
        </div>

        <div class="load-more-container">
            <button class="load-more-btn" id="load-more-btn" onclick="loadMoreMovies()">Load More Movies</button>
        </div>
    </div>

    <script>
        const API_KEY = '93a5c52b939ffbcb3cd561c8a1f8b880';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';
        
        let currentPage = 1; // পেজ ট্র্যাকিং এর জন্য

        async function fetchMovies(page) {
            const API_URL = `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=en-US&page=${page}`;
            const movieGrid = document.getElementById('movie-grid');

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                let htmlOutput = '';

                data.results.forEach(movie => {
                    const posterPath = movie.poster_path 
                        ? `${IMAGE_BASE_URL}${movie.poster_path}` 
                        : 'https://via.placeholder.com/500x750?text=No+Image';

                    // TMDB এর অরিজিনাল মুভি পেজের লিংক তৈরি করা হলো
                    const tmdbLink = `https://www.themoviedb.org/movie/${movie.id}`;

                    // onclick ইভেন্ট যুক্ত করা হয়েছে, যাতে ক্লিক করলে নতুন ট্যাবে মুভি ওপেন হয়
                    htmlOutput += `
                        <div class="movie-card" onclick="window.open('${tmdbLink}', '_blank')">
                            <img src="${posterPath}" alt="${movie.title}" class="movie-poster">
                            <div class="movie-info">
                                <div class="movie-title">${movie.title}</div>
                                <div class="movie-rating">⭐ ${movie.vote_average.toFixed(1)} | 📅 ${movie.release_date}</div>
                            </div>
                        </div>
                    `;
                });

                // নতুন মুভিগুলো আগের মুভিগুলোর সাথে যুক্ত করা হচ্ছে (রিপ্লেস না করে)
                movieGrid.insertAdjacentHTML('beforeend', htmlOutput);

            } catch (error) {
                console.error('Error fetching data:', error);
                alert('ডেটা লোড করতে সমস্যা হয়েছে!');
            }
        }

        // বাটন ক্লিক করলে পেজ নাম্বার বাড়বে এবং নতুন মুভি আসবে
        function loadMoreMovies() {
            currentPage++;
            fetchMovies(currentPage);
        }

        // প্রথমে ওয়েবসাইট ওপেন হলেই পেজ-১ এর ডেটা লোড হবে
        fetchMovies(currentPage);
    </script>
</body>
</html>
