<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMBD - Movie Download & Streaming</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: "#0a0a0a",
                        surface: "#141414",
                        primary: "#ff0000", /* Red accent like screenshot */
                        textMain: "#ffffff",
                        textMuted: "#9ca3af",
                    }
                }
            }
        }
    </script>

    <style>
        /* Hide scrollbar for horizontal scrolling but allow scroll */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        .section-title::before {
            content: '';
            display: inline-block;
            width: 3px;
            height: 18px;
            background-color: #ff0000;
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Sidebar Transition */
        #sidebar { transition: left 0.3s ease-in-out; }
        #sidebar-overlay { transition: opacity 0.3s ease-in-out; }

        /* Carousel Transition */
        .carousel-track { transition: transform 0.5s ease-in-out; }
        
        .dot { height: 4px; width: 16px; background-color: rgba(255,255,255,0.3); transition: background-color 0.3s; }
        .dot.active { background-color: #ffffff; }
    </style>
</head>
<body class="bg-background text-textMain antialiased overflow-x-hidden">

    <!-- Top Navigation Bar -->
    <header class="fixed w-full top-0 z-50 bg-[#111111] border-b border-white/5 h-14 flex items-center justify-between px-4">
        <!-- Menu Icon -->
        <button onclick="toggleSidebar()" class="text-white p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        
        <!-- Logo -->
        <a onclick="setCategory('home')" class="text-xl font-bold tracking-wider cursor-pointer flex items-center gap-2">
            <span class="text-white">HMBD</span><span class="text-primary text-sm font-normal">.com</span>
        </a>

        <!-- Search Icon -->
        <button onclick="toggleSearch()" class="text-white p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </button>
    </header>

    <!-- Hidden Search Bar -->
    <div id="search-bar" class="fixed top-14 w-full bg-[#111] z-40 hidden p-3 border-b border-white/10">
        <input type="text" id="search-input" oninput="handleLiveSearch()" placeholder="Search movies..." class="w-full bg-[#222] text-white px-4 py-2 rounded focus:outline-none text-sm">
    </div>

    <!-- Sidebar Menu (Drawer) -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/70 z-[60] hidden opacity-0"></div>
    <div id="sidebar" class="fixed inset-y-0 left-[-100%] w-[80%] max-w-sm bg-[#111111] z-[70] overflow-y-auto pb-10">
        <div class="flex items-center justify-between p-4 border-b border-white/10">
            <span class="text-lg font-bold">Menu</span>
            <button onclick="toggleSidebar()" class="text-primary p-1"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        
        <!-- Alphabet Filter (Visual) -->
        <div class="flex overflow-x-auto hide-scroll gap-4 p-4 border-b border-white/10 text-xs text-textMuted">
            <span>#</span><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span>
        </div>

        <div class="p-4 space-y-6">
            <div>
                <h3 class="text-sm font-bold mb-3 text-white">Categories</h3>
                <ul class="grid grid-cols-2 gap-y-3 text-sm text-textMuted">
                    <li onclick="setCategory('home')" class="cursor-pointer hover:text-white">Bollywood Hindi</li>
                    <li onclick="setCategory('home')" class="cursor-pointer hover:text-white">English (Hollywood)</li>
                    <li onclick="setCategory('home')" class="cursor-pointer hover:text-white">Dual Audio</li>
                    <li onclick="setCategory('home')" class="cursor-pointer hover:text-white">South Indian</li>
                </ul>
            </div>
            <div>
                <h3 class="text-sm font-bold mb-3 text-white">Genres</h3>
                <ul class="grid grid-cols-2 gap-y-3 text-sm text-textMuted">
                    <li onclick="setCategory('action')" class="cursor-pointer hover:text-white">- Action</li>
                    <li onclick="setCategory('romance')" class="cursor-pointer hover:text-white">- Romance</li>
                    <li onclick="setCategory('adult')" class="cursor-pointer hover:text-white">- Thriller</li>
                    <li onclick="setCategory('home')" class="cursor-pointer hover:text-white">- Comedy</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Main Content (Adds margin for fixed header) -->
    <main class="mt-14 pb-20">
        
        <!-- 3-Second Auto Update Banner (Hero Carousel) -->
        <div class="relative w-full h-[220px] md:h-[400px] bg-surface overflow-hidden">
            <div id="carousel-track" class="carousel-track flex w-full h-full">
                <!-- Carousel items injected by JS -->
            </div>
            
            <!-- Carousel Dots -->
            <div id="carousel-dots" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5">
                <!-- Dots injected by JS -->
            </div>
        </div>

        <!-- Ad Banner Above Featured -->
        <div class="flex justify-center my-4">
            <script async="async" data-cfasync="false" src="https://pl31008816.profitableratecpmnetwork.com/8e9094986a453471eab78291c50b779f/invoke.js"></script>
            <div id="container-8e9094986a453471eab78291c50b779f"></div>
        </div>

        <!-- Featured Section (Horizontal Scroll) -->
        <div class="mt-6">
            <div class="flex justify-between items-center px-4 mb-3">
                <h2 class="text-lg text-white section-title">Featured</h2>
                <div class="flex gap-1">
                    <button onclick="scrollFeatured(-1)" class="bg-[#222] p-1 rounded"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                    <button onclick="scrollFeatured(1)" class="bg-[#222] p-1 rounded"><svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                </div>
            </div>
            <div id="featured-grid" class="flex overflow-x-auto hide-scroll gap-3 px-4 snap-x">
                <!-- Featured Cards injected by JS -->
            </div>
        </div>

        <!-- Latest Movies (Grid View) -->
        <div class="mt-8 px-4">
            <div class="flex justify-between items-center mb-3">
                <h2 id="main-section-title" class="text-lg text-white section-title">Latest Movies</h2>
                <button class="bg-primary text-white text-[10px] font-bold px-2 py-1 rounded">SEE ALL</button>
            </div>
            <div id="movie-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                <!-- Grid Cards injected by JS -->
            </div>
        </div>

        <!-- Latest Updates (List View) -->
        <div class="mt-8 px-4">
            <h2 class="text-lg text-white mb-3 font-bold">Latest Updates</h2>
            <div id="list-view-container" class="space-y-3">
                <!-- List items injected by JS -->
            </div>
        </div>
        
        <!-- Auto Load Loader -->
        <div id="loading-indicator" class="text-center mt-8 hidden">
            <p class="text-textMuted text-sm">Loading...</p>
        </div>

    </main>

    <!-- Ad Banner Below Content -->
    <div class="flex justify-center my-6">
        <script>
            atOptions = {
                'key' : '28d9a86d009d105b82893c63bcb4a2cd',
                'format' : 'iframe',
                'height' : 300,
                'width' : 160,
                'params' : {}
            };
        </script>
        <script src="https://www.highrevenueformat.com/28d9a86d009d105b82893c63bcb4a2cd/invoke.js"></script>
    </div>

    <!-- Adsterra Popunder & Social Bar -->
    <script src="https://pl31008814.profitableratecpmnetwork.com/d0/4c/38/d04c388396c722ea1cfeddfbd05afc27.js"></script>
    <script src="https://pl31008815.profitableratecpmnetwork.com/2d/3c/ef/2d3cef3a5c44c5e6a9c64bf5ce166f69.js"></script>

    <!-- App Logic -->
    <script>
        const API_KEY = '93a5c52b939ffbcb3cd561c8a1f8b880';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w780';
        const POSTER_BASE_URL = 'https://image.tmdb.org/t/p/w342';
        const THUMB_BASE_URL = 'https://image.tmdb.org/t/p/w154';
        
        let currentPage = 1;
        let isFetching = false;
        let currentUrl = `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=en-US`;
        let searchTimeout = null;
        
        // Carousel Variables
        let carouselInterval;
        let currentSlide = 0;
        let totalSlides = 5;

        const endpoints = {
            home: `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=en-US`,
            action: `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=28`,
            romance: `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=10749`,
            adult: `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=53,27&include_adult=true`
        };

        // --- UI Interactions ---

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.style.left === '0px') {
                sidebar.style.left = '-100%';
                overlay.style.opacity = '0';
                setTimeout(() => overlay.classList.add('hidden'), 300);
            } else {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.style.opacity = '1', 10);
                sidebar.style.left = '0px';
            }
        }

        function toggleSearch() {
            const searchBar = document.getElementById('search-bar');
            searchBar.classList.toggle('hidden');
            if(!searchBar.classList.contains('hidden')){
                document.getElementById('search-input').focus();
            }
        }

        function scrollFeatured(direction) {
            const container = document.getElementById('featured-grid');
            container.scrollBy({ left: direction * 150, behavior: 'smooth' });
        }

        // --- Ad / Movie Play Logic ---
        
        function handleMovieClick(movieId) {
            const watchLink = `https://vidsrc.me/embed/movie?tmdb=${movieId}`;
            const smartLink = "https://www.profitableratecpmnetwork.com/hh3ntsst?key=f75560326eef0c5f8b5aacdcba1faa1e";
            
            let hasSeenAd = sessionStorage.getItem('ad_seen_' + movieId);
            
            if (!hasSeenAd) {
                sessionStorage.setItem('ad_seen_' + movieId, 'true');
                window.location.href = smartLink;
            } else {
                window.open(watchLink, '_blank');
            }
        }

        // --- Fetch & Render Logic ---

        function setCategory(category) {
            toggleSidebar(); // Close sidebar
            document.getElementById('search-input').value = '';
            document.getElementById('search-bar').classList.add('hidden');
            
            currentUrl = endpoints[category] || endpoints['home'];
            currentPage = 1;
            document.getElementById('main-section-title').innerText = category === 'home' ? 'Latest Movies' : 'Search Results';
            
            document.getElementById('movie-grid').innerHTML = '';
            document.getElementById('list-view-container').innerHTML = '';
            
            fetchMovies(currentUrl, currentPage);
        }

        function handleLiveSearch() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('search-input').value.trim();
            
            if (query === '') {
                currentUrl = endpoints['home'];
                currentPage = 1;
                document.getElementById('movie-grid').innerHTML = '';
                document.getElementById('list-view-container').innerHTML = '';
                fetchMovies(currentUrl, currentPage);
                return;
            }
            
            searchTimeout = setTimeout(() => {
                currentUrl = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
                currentPage = 1;
                document.getElementById('main-section-title').innerText = `Search Results`;
                document.getElementById('movie-grid').innerHTML = '';
                document.getElementById('list-view-container').innerHTML = '';
                fetchMovies(currentUrl, currentPage);
            }, 500);
        }

        async function fetchMovies(url, page) {
            if (isFetching) return;
            isFetching = true;
            document.getElementById('loading-indicator').classList.remove('hidden');

            try {
                const response = await fetch(`${url}&page=${page}`);
                const data = await response.json();
                
                if (page === 1) {
                    setupHeroCarousel(data.results.slice(0, 5));
                    setupFeatured(data.results.slice(5, 12));
                    renderGrid(data.results.slice(12, 20));
                    renderList(data.results.slice(0, 8)); // Re-use some for the list view
                } else {
                    renderGrid(data.results);
                }

            } catch (error) {
                console.error('Error:', error);
            } finally {
                isFetching = false;
                document.getElementById('loading-indicator').classList.add('hidden');
            }
        }

        // 1. Auto Update Banner (Hero)
        function setupHeroCarousel(movies) {
            const track = document.getElementById('carousel-track');
            const dotsContainer = document.getElementById('carousel-dots');
            track.innerHTML = '';
            dotsContainer.innerHTML = '';
            totalSlides = movies.length;

            movies.forEach((movie, index) => {
                const img = movie.backdrop_path ? `${IMAGE_BASE_URL}${movie.backdrop_path}` : `${POSTER_BASE_URL}${movie.poster_path}`;
                const year = movie.release_date ? movie.release_date.substring(0, 4) : '';
                
                track.innerHTML += `
                    <div onclick="handleMovieClick('${movie.id}')" class="min-w-full h-full relative cursor-pointer">
                        <img src="${img}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#111] via-transparent to-transparent"></div>
                        <div class="absolute bottom-6 left-4 right-4">
                            <h2 class="text-white font-bold text-lg leading-tight shadow-black drop-shadow-md">${movie.title} (${year})</h2>
                            <span class="inline-block mt-1 bg-primary text-white text-[10px] font-bold px-1.5 py-0.5 rounded">MOVIE</span>
                        </div>
                    </div>
                `;
                
                dotsContainer.innerHTML += `<div class="dot ${index === 0 ? 'active' : ''}"></div>`;
            });

            // Start Auto Slide (3 seconds)
            clearInterval(carouselInterval);
            currentSlide = 0;
            carouselInterval = setInterval(() => {
                currentSlide = (currentSlide + 1) % totalSlides;
                track.style.transform = `translateX(-${currentSlide * 100}%)`;
                
                // Update dots
                document.querySelectorAll('.dot').forEach((dot, idx) => {
                    dot.classList.toggle('active', idx === currentSlide);
                });
            }, 3000);
        }

        // 2. Featured Section (Horizontal Scroll)
        function setupFeatured(movies) {
            const container = document.getElementById('featured-grid');
            container.innerHTML = '';
            
            movies.forEach(movie => {
                const poster = movie.poster_path ? `${POSTER_BASE_URL}${movie.poster_path}` : 'https://via.placeholder.com/342x513';
                const year = movie.release_date ? movie.release_date.substring(0, 4) : '';
                
                container.innerHTML += `
                    <div onclick="handleMovieClick('${movie.id}')" class="min-w-[130px] w-[130px] snap-start relative cursor-pointer bg-[#1a1a1a] rounded overflow-hidden">
                        <div class="absolute top-0 left-0 bg-primary text-white text-[9px] font-bold px-1.5 py-0.5 z-10">FEATURE</div>
                        <img src="${poster}" class="w-full h-[190px] object-cover">
                        <div class="absolute bottom-0 right-0 bg-black/80 text-[#f5c518] text-[10px] font-bold px-1.5 py-0.5 z-10 flex items-center gap-1">
                            ⭐ ${movie.vote_average.toFixed(1)}
                        </div>
                    </div>
                `;
            });
        }

        // 3. Grid View (Latest Movies)
        function renderGrid(movies) {
            const grid = document.getElementById('movie-grid');
            
            movies.forEach(movie => {
                const poster = movie.poster_path ? `${POSTER_BASE_URL}${movie.poster_path}` : 'https://via.placeholder.com/342x513';
                const year = movie.release_date ? movie.release_date.substring(0, 4) : '';
                
                grid.innerHTML += `
                    <div onclick="handleMovieClick('${movie.id}')" class="relative cursor-pointer bg-[#1a1a1a] rounded overflow-hidden">
                        <div class="absolute top-0 left-0 bg-primary text-white text-[9px] font-bold px-1.5 py-0.5 z-10">Dual Audio</div>
                        <img src="${poster}" class="w-full aspect-[2/3] object-cover">
                    </div>
                `;
            });
        }

        // 4. List View (Latest Updates)
        function renderList(movies) {
            const listContainer = document.getElementById('list-view-container');
            
            movies.forEach(movie => {
                const thumb = movie.poster_path ? `${THUMB_BASE_URL}${movie.poster_path}` : 'https://via.placeholder.com/154x231';
                const year = movie.release_date ? movie.release_date.substring(0, 4) : '';
                
                listContainer.innerHTML += `
                    <div onclick="handleMovieClick('${movie.id}')" class="flex gap-3 items-center cursor-pointer hover:bg-white/5 p-1 rounded transition">
                        <img src="${thumb}" class="w-[60px] h-[90px] object-cover rounded">
                        <div class="flex-1">
                            <h3 class="text-white text-sm font-medium line-clamp-2">${movie.title} [${year}] Dual Audio</h3>
                            <p class="text-textMuted text-xs mt-1">${year}</p>
                            <p class="text-textMuted text-xs mt-1 flex items-center gap-1">⭐ ${movie.vote_average.toFixed(1)}</p>
                        </div>
                    </div>
                `;
            });
        }

        // Infinite Scroll
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                if (!isFetching) {
                    currentPage++;
                    fetchMovies(currentUrl, currentPage);
                }
            }
        });

        // Init
        fetchMovies(currentUrl, currentPage);

    </script>
</body>
</html>
