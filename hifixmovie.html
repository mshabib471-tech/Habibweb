            if (!num) return '0';

            return num.toString();

            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;

                            </h1>

                            <div className="flex flex-wrap items-center gap-4 text-gray-300 text-sm">
                                <div className="flex items-center gap-1 text-yellow-400">
                                    <Icon name="star" size={16} className="fill-current" />
                                    <span className="font-bold text-white">{movie.averageRating}</span>
                                    <span className="text-gray-500">/10</span>
                                </div>
                                <span>{movie.runtimeMinutes} min</span>
                                <span>{movie.genres.join(', ')}</span>
                            </div>

                            <p className="text-lg text-gray-200 max-w-xl leading-relaxed drop-shadow-md line-clamp-3">
                                {movie.description}
                            </p>

                            <div className="flex flex-wrap gap-4 pt-4">
                                {movie.trailer && (
                                    <button 
                                        onClick={() => onPlayTrailer(movie)}
                                        className="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded font-bold flex items-center gap-2 transition transform hover:scale-105 shadow-lg shadow-red-900/20"
                                    >
                                        <Icon name="play" size={20} className="fill-current" />
                                        Watch Trailer
                                    </button>
                                )}
                                <button 
                                    onClick={() => onViewDetails(movie)}
                                    className="bg-gray-600/60 hover:bg-gray-600/80 backdrop-blur-sm text-white px-8 py-3 rounded font-bold flex items-center gap-2 transition border border-gray-500"
                                >
                                    <Icon name="info" size={20} />
                                    More Details
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const MovieCard = ({ movie, onClick, onToggleWatchlist, isInWatchlist }) => {
            return (
                <div 
                    className="group relative aspect-[2/3] rounded-xl overflow-hidden cursor-pointer glass-card"
                    onClick={() => onClick(movie)}
                >
                    <img 
                        src={movie.primaryImage} 
                        alt={movie.primaryTitle}
                        className="w-full h-full object-cover transition duration-500 group-hover:scale-110"
                        loading="lazy"
                    />
                    
                    {/* Hover Overlay */}
                    <div className="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex flex-col justify-end p-4">
                        <div className="transform translate-y-4 group-hover:translate-y-0 transition duration-300">
                            <h3 className="font-bold text-white text-lg leading-tight mb-1">{movie.primaryTitle}</h3>
                            <div className="flex items-center justify-between text-xs text-gray-300 mb-3">
                                <span>{movie.startYear}</span>
                                <span className="border border-gray-500 px-1 rounded">{movie.contentRating}</span>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                <button className="bg-white text-black rounded-full p-2 hover:bg-gray-200 transition">
                                    <Icon name="play" size={16} className="fill-current ml-0.5" />
                                </button>
                                <button 
                                    onClick={(e) => { e.stopPropagation(); onToggleWatchlist(movie.id); }}
                                    className={`border rounded-full p-2 transition ${isInWatchlist ? 'bg-red-600 border-red-600 text-white' : 'border-white text-white hover:bg-white/20'}`}
                                >
                                    <Icon name={isInWatchlist ? "trash" : "plus"} size={16} />
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Default Badge */}
                    <div className="absolute top-2 right-2 bg-black/60 backdrop-blur px-2 py-1 rounded text-xs font-bold text-white">
                        {movie.averageRating} <span className="text-yellow-400">★</span>
                    </div>
                </div>
            );
        };

        const Section = ({ title, children, onViewAll }) => (
            <section className="py-8 px-6 md:px-12 lg:px-24">
                <div className="flex justify-between items-end mb-6">
                    <h2 className="text-2xl md:text-3xl font-bold text-white border-l-4 border-red-600 pl-4">{title}</h2>
                    {onViewAll && (
                        <button onClick={onViewAll} className="text-sm text-gray-400 hover:text-white transition flex items-center gap-1">
                            View All <Icon name="chevronRight" size={16} />
                        </button>
                    )}
                </div>
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
                    {children}
                </div>
            </section>
        );

        const Carousel = ({ title, movies, onMovieClick, onToggleWatchlist, watchlist }) => {
            const scrollRef = useRef(null);

            const scroll = (direction) => {
                if (scrollRef.current) {
                    const { current } = scrollRef;
                    const scrollAmount = direction === 'left' ? -current.offsetWidth : current.offsetWidth;
                    current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                }
            };

            return (
                <section className="py-8 relative group">
                    <div className="px-6 md:px-12 lg:px-24 mb-4 flex justify-between items-center">
                         <h2 className="text-2xl font-bold text-white">{title}</h2>
                         <div className="flex gap-2">
                             <button onClick={() => scroll('left')} className="p-2 bg-black/50 hover:bg-red-600 rounded-full text-white transition"><Icon name="chevronLeft" size={20}/></button>
                             <button onClick={() => scroll('right')} className="p-2 bg-black/50 hover:bg-red-600 rounded-full text-white transition"><Icon name="chevronRight" size={20}/></button>
                         </div>
                    </div>
                    
                    <div 
                        ref={scrollRef}
                        className="flex overflow-x-auto gap-4 px-6 md:px-12 lg:px-24 pb-4 scrollbar-hide snap-x"
                        style={{ scrollbarWidth: 'none', msOverflowStyle: 'none' }}
                    >
                        {movies.map(movie => (
                            <div key={movie.id} className="min-w-[160px] md:min-w-[200px] snap-start">
                                <MovieCard 
                                    movie={movie} 
                                    onClick={onMovieClick} 
                                    onToggleWatchlist={onToggleWatchlist}
                                    isInWatchlist={watchlist.includes(movie.id)}
                                />
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const FilterDrawer = ({ isOpen, onClose, filters, setFilters, availableGenres, availableCountries }) => {
            if (!isOpen) return null;

            const toggleGenre = (genre) => {
                setFilters(prev => {
                    const exists = prev.genres.includes(genre);
                    return {
                        ...prev,
                        genres: exists ? prev.genres.filter(g => g !== genre) : [...prev.genres, genre]
                    };
                });
            };

            const toggleType = (type) => {
                 setFilters(prev => ({ ...prev, type: prev.type === type ? 'all' : type }));
            };

            return (
                <div className="fixed inset-0 z-[60] flex justify-end">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative w-full max-w-md bg-[#141414] h-full overflow-y-auto border-l border-white/10 animate-fade-in">
                        <div className="p-6 space-y-8">
                            <div className="flex justify-between items-center">
                                <h2 className="text-2xl font-bold">Filters</h2>
                                <button onClick={onClose}><Icon name="x" size={24} /></button>
                            </div>

                            {/* Type */}
                            <div>
                                <h3 className="text-sm font-bold text-gray-400 uppercase mb-3">Type</h3>
                                <div className="flex gap-2 flex-wrap">
                                    {['all', 'movie', 'tvSeries'].map(type => (
                                        <button 
                                            key={type}
                                            onClick={() => toggleType(type)}
                                            className={`px-4 py-2 rounded-full text-sm border transition ${filters.type === type ? 'bg-red-600 border-red-600 text-white' : 'border-gray-700 text-gray-300 hover:border-white'}`}
                                        >
                                            {type === 'all' ? 'All' : type === 'tvSeries' ? 'TV Shows' : 'Movies'}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Genres */}
                            <div>
                                <h3 className="text-sm font-bold text-gray-400 uppercase mb-3">Genres</h3>
                                <div className="flex flex-wrap gap-2">
                                    {availableGenres.map(genre => (
                                        <button 
                                            key={genre}
                                            onClick={() => toggleGenre(genre)}
                                            className={`px-3 py-1 rounded text-xs border transition ${filters.genres.includes(genre) ? 'bg-white text-black border-white' : 'border-gray-700 text-gray-400 hover:border-gray-500'}`}
                                        >
                                            {genre}
                                        </button>
                                    ))}
                                </div>
                            </div>

                             {/* Rating */}
                             <div>
                                <h3 className="text-sm font-bold text-gray-400 uppercase mb-3">Min Rating: {filters.minRating}</h3>
                                <input 
                                    type="range" 
                                    min="0" 
                                    max="10" 
                                    step="0.5"
                                    value={filters.minRating}
                                    onChange={(e) => setFilters({...filters, minRating: parseFloat(e.target.value)})}
                                    className="w-full accent-red-600"
                                />
                            </div>

                            <button 
                                onClick={() => setFilters({ type: 'all', genres: [], minRating: 0, country: 'all' })}
                                className="w-full py-3 border border-gray-700 rounded text-gray-300 hover:bg-white/5 transition"
                            >
                                Reset Filters
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const MovieModal = ({ movie, onClose, onPlayTrailer, onToggleWatchlist, isInWatchlist }) => {
            if (!movie) return null;

            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/90 backdrop-blur-md" onClick={onClose}></div>
                    
                    <div className="relative w-full max-w-5xl bg-[#141414] rounded-2xl overflow-hidden shadow-2xl border border-white/10 max-h-[90vh] overflow-y-auto animate-fade-in">
                        <button onClick={onClose} className="absolute top-4 right-4 z-10 bg-black/50 p-2 rounded-full hover:bg-red-600 transition">
                            <Icon name="x" size={24} />
                        </button>

                        <div className="grid md:grid-cols-3 gap-0">
                            {/* Poster Side */}
                            <div className="md:col-span-1 relative h-64 md:h-auto">
                                <img src={movie.primaryImage} alt={movie.primaryTitle} className="w-full h-full object-cover" />
                                <div className="absolute inset-0 bg-gradient-to-t from-[#141414] to-transparent md:bg-gradient-to-r"></div>
                            </div>

                            {/* Info Side */}
                            <div className="md:col-span-2 p-8 space-y-6">
                                <div>
                                    <h2 className="text-4xl font-bold serif mb-2">{movie.primaryTitle}</h2>
                                    {movie.originalTitle && movie.originalTitle !== movie.primaryTitle && (
                                        <p className="text-gray-400 italic">{movie.originalTitle}</p>
                                    )}
                                </div>

                                <div className="flex flex-wrap items-center gap-4 text-sm">
                                    <span className="text-green-500 font-bold">{movie.averageRating * 10}% Match</span>
                                    <span>{movie.startYear}</span>
                                    <span className="border border-gray-600 px-1 rounded text-xs">{movie.contentRating}</span>
                                    <span>{movie.runtimeMinutes}m</span>
                                    <span className="uppercase text-xs border border-gray-700 px-2 py-0.5 rounded">{movie.type}</span>
                                </div>

                                <p className="text-gray-300 leading-relaxed text-lg">{movie.description}</p>

                                <div className="grid grid-cols-2 gap-4 text-sm">
                                    <div>
                                        <span className="text-gray-500 block">Genres</span>
                                        <span className="text-white">{movie.genres.join(', ')}</span>
                                    </div>
                                    <div>
                                        <span className="text-gray-500 block">Countries</span>
                                        <span className="text-white">{movie.countriesOfOrigin.join(', ')}</span>
                                    </div>
                                    <div>
                                        <span className="text-gray-500 block">Languages</span>
                                        <span className="text-white">{movie.spokenLanguages.join(', ').toUpperCase()}</span>
                                    </div>
                                    <div>
                                        <span className="text-gray-500 block">Budget</span>
                                        <span className="text-white">{formatCurrency(movie.budget)}</span>
                                    </div>
                                </div>

                                <div className="flex gap-4 pt-4">
                                    {movie.trailer && (
                                        <button 
                                            onClick={() => onPlayTrailer(movie)}
                                            className="flex-1 bg-white text-black py-3 rounded font-bold hover:bg-gray-200 transition flex items-center justify-center gap-2"
                                        >
                                            <Icon name="play" size={20} className="fill-current" /> Play Trailer
                                        </button>
                                    )}
                                    <button 
                                        onClick={() => onToggleWatchlist(movie.id)}
                                        className={`flex-1 border py-3 rounded font-bold transition flex items-center justify-center gap-2 ${isInWatchlist ? 'border-red-600 text-red-600 bg-red-600/10' : 'border-gray-600 text-white hover:border-white'}`}
                                    >
                                        <Icon name={isInWatchlist ? "trash" : "plus"} size={20} /> 
                                        {isInWatchlist ? 'Remove from Watchlist' : 'Add to Watchlist'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TrailerModal = ({ youtubeId, onClose }) => {
            if (!youtubeId) return null;

            return (
                <div className="fixed inset-0 z-[80] flex items-center justify-center bg-black/95 backdrop-blur-lg p-4" onClick={onClose}>
                     <button onClick={onClose} className="absolute top-6 right-6 text-white hover:text-red-600 transition">
                        <Icon name="x" size={32} />
                    </button>
                    <div className="w-full max-w-6xl aspect-video bg-black shadow-2xl" onClick={e => e.stopPropagation()}>
                        <iframe 
                            width="100%" 
                            height="100%" 
                            src={`https://www.youtube.com/embed/${youtubeId}?autoplay=1`} 
                            title="YouTube video player" 
                            frameBorder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowFullScreen
                        ></iframe>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---

        const App = () => {
            const [view, setView] = useState('home'); // home, search, watchlist, details
            const [selectedMovie, setSelectedMovie] = useState(null);
            const [trailerMovie, setTrailerMovie] = useState(null);
            const [watchlist, setWatchlist] = useState(() => {
                const saved = localStorage.getItem('cineflix_watchlist');
                return saved ? JSON.parse(saved) : [];
            });
            const [searchQuery, setSearchQuery] = useState('');
            const [filters, setFilters] = useState({ type: 'all', genres: [], minRating: 0, country: 'all' });
            const [isFilterOpen, setIsFilterOpen] = useState(false);

            // Derived Data
            const allGenres = [...new Set(RAW_DATA.flatMap(m => m.genres))].sort();
            
            const filteredData = useMemo(() => {
                return RAW_DATA.filter(movie => {
                    // Search Filter
                    if (searchQuery) {
                        const q = searchQuery.toLowerCase();
                        if (!movie.primaryTitle.toLowerCase().includes(q) && 
                            !movie.genres.some(g => g.toLowerCase().includes(q))) return false;
                    }

                    // Type Filter
                    if (filters.type !== 'all') {
                        if (filters.type === 'tvSeries' && movie.type !== 'tvSeries') return false;
                        if (filters.type === 'movie' && movie.type !== 'movie') return false;
                    }

                    // Genre Filter
                    if (filters.genres.length > 0) {
                        if (!filters.genres.some(g => movie.genres.includes(g))) return false;
                    }

                    // Rating Filter
                    if (movie.averageRating < filters.minRating) return false;

                    return true;
                });
            }, [searchQuery, filters]);

            // Effects
            useEffect(() => {
                localStorage.setItem('cineflix_watchlist', JSON.stringify(watchlist));
            }, [watchlist]);

            // Handlers
            const toggleWatchlist = (id) => {
                setWatchlist(prev => 
                    prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]
                );
            };

            const handleViewDetails = (movie) => {
                setSelectedMovie(movie);
            };

            const handlePlayTrailer = (movie) => {
                setTrailerMovie(movie);
            };

            // Render Helpers
            const renderContent = () => {
                if (view === 'search') {
                    return (
                        <div className="pt-24 px-6 md:px-12 lg:px-24 min-h-screen">
                            <div className="flex justify-between items-center mb-8">
                                <h1 className="text-3xl font-bold">Search Results "{searchQuery}"</h1>
                                <button onClick={() => setIsFilterOpen(true)} className="flex items-center gap-2 text-gray-300 hover:text-white">
                                    <Icon name="filter" size={20} /> Filters
                                </button>
                            </div>
                            
                            {filteredData.length === 0 ? (
                                <div className="text-center py-20 text-gray-500">
                                    <p className="text-xl">No movies found matching your criteria.</p>
                                    <button onClick={() => {setSearchQuery(''); setFilters({type:'all', genres:[], minRating:0});}} className="mt-4 text-red-500 hover:underline">Clear Filters</button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                                    {filteredData.map(movie => (
                                        <MovieCard 
                                            key={movie.id} 
                                            movie={movie} 
                                            onClick={handleViewDetails}
                                            onToggleWatchlist={toggleWatchlist}
                                            isInWatchlist={watchlist.includes(movie.id)}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>
                    );
                }

                if (view === 'watchlist') {
                    const watchlistMovies = RAW_DATA.filter(m => watchlist.includes(m.id));
                    return (
                        <div className="pt-24 px-6 md:px-12 lg:px-24 min-h-screen">
                            <h1 className="text-3xl font-bold mb-8">My Watchlist</h1>
                            {watchlistMovies.length === 0 ? (
                                <div className="text-center py-20 text-gray-500">
                                    <Icon name="heart" size={48} className="mx-auto mb-4 opacity-20" />
                                    <p className="text-xl">Your watchlist is empty.</p>
                                    <button onClick={() => setView('home')} className="mt-4 text-red-500 hover:underline">Browse Movies</button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                                    {watchlistMovies.map(movie => (
                                        <MovieCard 
                                            key={movie.id} 
                                            movie={movie} 
                                            onClick={handleViewDetails}
                                            onToggleWatchlist={toggleWatchlist}
                                            isInWatchlist={true}
                                        />
                                    ))}
                                </div>
                            )}
                        </div>
                    );
                }

                // Home View
                const trending = RAW_DATA.slice(0, 10);
                const popularMovies = RAW_DATA.filter(m => m.type === 'movie').slice(0, 10);
                const popularTV = RAW_DATA.filter(m => m.type === 'tvSeries').slice(0, 10);
                const topRated = [...RAW_DATA].sort((a,b) => b.averageRating - a.averageRating).slice(0, 10);
                
                return (
                    <>
                        <Hero 
                            movie={RAW_DATA[0]} 
                            onPlayTrailer={handlePlayTrailer} 
                            onViewDetails={handleViewDetails} 
                        />
                        
                        <Carousel 
                            title="Trending Now" 
                            movies={trending} 
                            onMovieClick={handleViewDetails}
                            onToggleWatchlist={toggleWatchlist}
                            watchlist={watchlist}
                        />
                        
                        <Section title="Popular Movies" onViewAll={() => {setSearchQuery(''); setFilters({...filters, type: 'movie'}); setView('search');}}>
                            {popularMovies.map(movie => (
                                <MovieCard 
                                    key={movie.id} 
                                    movie={movie} 
                                    onClick={handleViewDetails}
                                    onToggleWatchlist={toggleWatchlist}
                                    isInWatchlist={watchlist.includes(movie.id)}
                                />
                            ))}
                        </Section>

                        <Section title="Top Rated" onViewAll={() => {setSearchQuery(''); setFilters({...filters, minRating: 8}); setView('search');}}>
                            {topRated.map(movie => (
                                <MovieCard 
                                    key={movie.id} 
                                    movie={movie} 
                                    onClick={handleViewDetails}
                                    onToggleWatchlist={toggleWatchlist}
                                    isInWatchlist={watchlist.includes(movie.id)}
                                />
                            ))}
                        </Section>

                         <Carousel 
                            title="Popular TV Shows" 
                            movies={popularTV} 
                            onMovieClick={handleViewDetails}
                            onToggleWatchlist={toggleWatchlist}
                            watchlist={watchlist}
                        />
                    </>
                );
            };

            return (
                <div className="min-h-screen bg-[#050505] text-white font-sans selection:bg-red-600 selection:text-white">
                    <Navbar 
                        onSearch={(q) => setSearchQuery(q)} 
                        currentView={view}
                        onChangeView={setView}
                    />
                    
                    <main>
                        {renderContent()}
                    </main>

                    <footer className="bg-black py-12 px-6 border-t border-gray-900 mt-12 text-center text-gray-500 text-sm">
                        <div className="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-8 text-left mb-8">
                            <div>
                                <h4 className="text-white font-bold mb-4">CINEFLIX</h4>
                                <ul className="space-y-2">
                                    <li><a href="#" className="hover:underline">About Us</a></li>
                                    <li><a href="#" className="hover:underline">Jobs</a></li>
                                    <li><a href="#" className="hover:underline">Press</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-bold mb-4">Support</h4>
                                <ul className="space-y-2">
                                    <li><a href="#" className="hover:underline">Help Center</a></li>
                                    <li><a href="#" className="hover:underline">Terms of Use</a></li>
                                    <li><a href="#" className="hover:underline">Privacy Policy</a></li>
                                </ul>
                            </div>
                             <div>
                                <h4 className="text-white font-bold mb-4">Connect</h4>
                                <ul className="space-y-2">
                                    <li><a href="#" className="hover:underline">Facebook</a></li>
                                    <li><a href="#" className="hover:underline">Twitter</a></li>
                                    <li><a href="#" className="hover:underline">Instagram</a></li>
                                </ul>
                            </div>
                        </div>
                        <p>&copy; 2026 Cineflix Inc. All rights reserved.</p>
                    </footer>

                    {/* Modals */}
                    {selectedMovie && (
                        <MovieModal 
                            movie={selectedMovie} 
                            onClose={() => setSelectedMovie(null)} 
                            onPlayTrailer={handlePlayTrailer}
                            onToggleWatchlist={toggleWatchlist}
                            isInWatchlist={watchlist.includes(selectedMovie.id)}
                        />
                    )}

                    {trailerMovie && (
                        <TrailerModal 
                            youtubeId={getYouTubeID(trailerMovie.trailer)} 
                            onClose={() => setTrailerMovie(null)} 
                        />
                    )}

                    <FilterDrawer 
                        isOpen={isFilterOpen} 
                        onClose={() => setIsFilterOpen(false)} 
                        filters={filters}
                        setFilters={setFilters}
                        availableGenres={allGenres}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
