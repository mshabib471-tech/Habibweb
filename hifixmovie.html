<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Movie Site</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        .movie-card { background: #333; margin: 10px 0; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Top 10 Movies</h1>
    <div id="movie-list">ডেটা লোড হচ্ছে, অপেক্ষা করুন...</div>

    <script>
        // ⚠️ সতর্কবার্তা: এই ফাইলটি কখনোই GitHub এ পাবলিক করবেন না!
        const API_KEY = '0553ed5965mshafbb4f10ce1ed1ap11dd72jsne52871457009'; 
        const HOST = 'imdb236.p.rapidapi.com';

        async function fetchMovies() {
            try {
                const response = await fetch(`https://${HOST}/api/imdb/top250-movies`, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-key': API_KEY,
                        'x-rapidapi-host': HOST
                    }
                });
                
                const data = await response.json();
                let htmlOutput = '';

                // প্রথম ১০টি মুভি স্ক্রিনে দেখানোর জন্য লুপ
                data.slice(0, 10).forEach((movie, index) => {
                    htmlOutput += `
                        <div class="movie-card">
                            <h3>${index + 1}. ${movie.originalTitle || movie.title}</h3>
                            <p>Rating: ⭐ ${movie.averageRating}</p>
                            <p>Year: ${movie.startYear}</p>
                        </div>
                    `;
                });

                document.getElementById('movie-list').innerHTML = htmlOutput;

            } catch (error) {
                document.getElementById('movie-list').innerHTML = "ডেটা লোড করতে সমস্যা হয়েছে।";
                console.error(error);
            }
        }

        fetchMovies();
    </script>
</body>
</html>
