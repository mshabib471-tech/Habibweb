<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - Repair Guy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-slate-200 bg-[#0f172a] relative flex flex-col items-center justify-center py-10 px-4">
  
  <div class="fixed inset-0 z-[-1] overflow-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-blue-900/20 blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-[#9E1B32]/20 blur-[150px]"></div>
  </div>

  <div class="max-w-[400px] w-full bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-[32px] shadow-2xl transition-all duration-500">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-white/10 border border-white/20 rounded-2xl mx-auto flex items-center justify-center mb-4">
        <i data-feather="users" class="text-rose-400 w-8 h-8"></i>
      </div>
      <h2 class="text-2xl font-bold text-white">Join the Community</h2>
      <p class="text-slate-400 text-sm mt-2">Login to like and comment on our blog posts.</p>
    </div>

    <form id="userLoginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-400 mb-1">Email Address</label>
        <input type="email" id="userEmail" required placeholder="Enter your email" class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white focus:border-rose-400 outline-none transition-colors">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-400 mb-1">Password</label>
        <input type="password" id="userPassword" required placeholder="Create or enter password" class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white focus:border-rose-400 outline-none transition-colors">
      </div>
      <button type="submit" class="w-full bg-[#9E1B32]/90 hover:bg-[#9E1B32] text-white font-bold py-3.5 rounded-xl transition-all mt-2 shadow-[0_0_15px_rgba(158,27,50,0.3)] hover:-translate-y-0.5">
        Login & Continue
      </button>
    </form>
    
    <div class="text-center mt-6">
      <a href="blog.html" class="text-sm text-slate-400 hover:text-rose-400 transition-colors flex justify-center items-center gap-1"><i data-feather="arrow-left" class="w-4 h-4"></i> Back to Blog</a>
    </div>
  </div>

  <script>
    feather.replace();

    document.getElementById('userLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('userEmail').value;
      
      // Save user email to local storage to simulate login
      localStorage.setItem('userEmail', email);
      
      // Redirect back to blog page to comment
      window.location.href = 'blog.html';
    });
  </script>
</body>
</html>
