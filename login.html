<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - Habib iFix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0a0f1e; overflow-x: hidden; }
    
    /* Background Blobs */
    @keyframes blob { 0%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-50px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.9)}100%{transform:translate(0,0) scale(1)} }
    .animate-blob { animation: blob 7s infinite; }
    .animation-delay-2000 { animation-delay: 2s; }

    /* Form Transitions */
    .form-wrapper { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); opacity: 1; transform: translateY(0); pointer-events: auto; }
    .form-wrapper.hidden-form { opacity: 0; transform: translateY(20px); pointer-events: none; position: absolute; width: 100%; top: 0; left: 0; }

    /* Neumorphic Input */
    .neu-input { background: rgba(10, 15, 30, 0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; transition: all 0.3s ease; }
    .neu-input:focus { border-color: rgba(6, 182, 212, 0.5); box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1), inset 0 2px 4px rgba(0,0,0,0.2); outline: none; }

    /* Glossy Button */
    .btn-glossy { background: linear-gradient(135deg, #0891b2, #7c3aed); position: relative; overflow: hidden; }
    .btn-glossy::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent); border-radius: 14px 14px 0 0; pointer-events: none; }
    .btn-glossy:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(6, 182, 212, 0.4); }

    /* =========================================
       CSS CHARACTER ANIMATION SYSTEM
       ========================================= */
    .scene {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
      perspective: 1000px;
    }

    .character-container {
      position: absolute;
      bottom: 20%;
      left: -150px; /* Start off-screen */
      width: 80px;
      height: 140px;
      transform-style: preserve-3d;
    }

    /* Walk In Animation */
    .walk-in { animation: walkIn 2s forwards ease-out; }
    @keyframes walkIn {
      0% { left: -150px; }
      100% { left: calc(50% - 40px); }
    }

    /* Idle Animation */
    .idle { animation: idle 2s infinite alternate ease-in-out; }
    @keyframes idle {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-3px) rotate(1deg); }
    }

    /* Kick Animation */
    .kick { animation: kickAnim 0.6s forwards ease-in-out; }
    @keyframes kickAnim {
      0% { transform: translateX(0); }
      30% { transform: translateX(-20px) rotate(-10deg); } /* Wind up */
      100% { transform: translateX(40px) rotate(20deg); } /* Kick forward */
    }

    /* Briefcase */
    .briefcase {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 30px;
      background: #451a03; /* Dark brown */
      border-radius: 4px;
      border: 2px solid #291002;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      z-index: 5;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .briefcase::after { /* Handle */
      content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
      width: 12px; height: 8px; border: 3px solid #291002; border-bottom: none; border-radius: 4px 4px 0 0;
    }
    .briefcase::before { /* Lock */
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 6px; height: 6px; background: #fbbf24; border-radius: 50%;
    }

    /* Briefcase Open State (Reveals Form) */
    .briefcase.open {
      transform: translateX(-50%) scale(15) translateY(-200px);
      background: rgba(15, 23, 41, 0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      width: 400px; /* Base size before scaling */
      height: 500px;
      opacity: 1;
      z-index: 20;
    }

    /* Character Parts */
    .head {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 30px; height: 30px; background: #fcd34d; border-radius: 50%; z-index: 2;
    }
    .body {
      position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
      width: 34px; height: 50px; background: #cbd5e1; border-radius: 10px 10px 4px 4px; z-index: 1;
    }
    .legs {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 34px; height: 60px; display: flex; justify-content: space-between;
    }
    .leg { width: 12px; height: 100%; background: #1e293b; border-radius: 0 0 4px 4px; }
    
    /* Arms */
    .arm {
      position: absolute; top: 32px; width: 10px; height: 40px; background: #cbd5e1; border-radius: 5px; z-index: 0;
    }
    .arm.left { left: 10px; transform-origin: top center; transform: rotate(10deg); }
    .arm.right { right: 10px; transform-origin: top center; transform: rotate(-10deg); }

    /* Arm swing during walk */
    .walk-in .arm.left { animation: swingLeft 0.4s infinite alternate; }
    .walk-in .arm.right { animation: swingRight 0.4s infinite alternate; }
    @keyframes swingLeft { from { transform: rotate(20deg); } to { transform: rotate(-20deg); } }
    @keyframes swingRight { from { transform: rotate(-20deg); } to { transform: rotate(20deg); } }

    /* Responsive adjustments for the briefcase form container */
    @media (max-width: 450px) {
      .briefcase.open { width: 90vw; height: 80vh; transform: translateX(-50%) scale(1) translateY(-10vh); }
      .character-container { transform: scale(0.8); bottom: 10%; }
    }
  </style>
</head>
<body class="min-h-screen text-slate-200 relative flex flex-col items-center justify-center py-10 px-4">

  <!-- Animated Background -->
  <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] rounded-full bg-cyan-500/15 blur-[120px] animate-blob mix-blend-screen"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-violet-600/20 blur-[150px] animate-blob animation-delay-2000 mix-blend-screen"></div>
  </div>

  <!-- Logo -->
  <div class="flex items-center gap-3 mb-8 z-20">
    <div class="w-12 h-12 rounded-xl overflow-hidden border border-white/20 bg-white/10 backdrop-blur-md shadow-lg flex items-center justify-center">
      <img src="https://i.ibb.co.com/2XJPZ5X/Chat-GPT-Image-Aug-15-2026-12-34-42-PM.png" alt="Logo" class="w-full h-full object-cover" width="48" height="48">
    </div>
    <span class="font-bold text-3xl tracking-tight text-white">Habib<span style="background:linear-gradient(90deg,#06b6d4,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">iFix</span></span>
  </div>

  <!-- ================= SCENE CONTAINER ================= -->
  <div class="scene" id="scene">
    
    <!-- The Character -->
    <div class="character-container" id="character">
      <div class="head"></div>
      <div class="body"></div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="legs">
        <div class="leg"></div>
        <div class="leg"></div>
      </div>
    </div>

    <!-- The Briefcase (Transforms into the form container) -->
    <div class="briefcase" id="briefcase">
      
      <!-- Content inside the briefcase (Forms) -->
      <div class="relative w-full h-full p-8 flex flex-col justify-center overflow-y-auto custom-scrollbar">
        
        <!-- LOGIN FORM -->
        <div id="loginFormWrapper" class="form-wrapper flex flex-col items-center w-full">
          <h2 class="text-2xl font-extrabold text-white mb-1">Welcome Back</h2>
          <p class="text-slate-500 text-xs mb-6">Sign in to your account</p>

          <p id="loginMessage" class="hidden text-xs text-center font-medium mb-4 p-2 rounded-lg border w-full"></p>

          <div class="relative w-full mb-3">
            <input type="email" id="loginEmail" placeholder="Email Address" required class="neu-input w-full px-4 py-3 pl-10 text-white placeholder-slate-500 text-sm">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm">✉️</span>
          </div>
          <div class="relative w-full mb-4">
            <input type="password" id="loginPassword" placeholder="Password" required class="neu-input w-full px-4 py-3 pl-10 text-white placeholder-slate-500 text-sm">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm">🔒</span>
          </div>

          <div class="w-full flex justify-between items-center mb-4 px-1">
            <button type="button" onclick="togglePhoneAuth()" class="text-[10px] text-slate-500 hover:text-cyan-400 transition-colors">📱 Use Phone?</button>
            <a href="contact.html" class="text-[10px] text-slate-500 hover:text-cyan-400 transition-colors">Forgot Password?</a>
          </div>

          <button type="submit" form="loginForm" class="btn-glossy w-full text-white font-bold py-3 rounded-xl text-sm tracking-wide mb-4">Sign In</button>

          <div class="flex items-center gap-3 w-full my-3">
            <div class="flex-1 h-px bg-white/10"></div>
            <span class="text-slate-500 text-[10px] uppercase tracking-wider">or continue with</span>
            <div class="flex-1 h-px bg-white/10"></div>
          </div>

          <button type="button" onclick="loginWithGoogle()" class="social-btn w-full py-2.5 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center gap-2 text-xs text-slate-300 hover:bg-white/10 hover:border-white/20 mb-4">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google"> Google
          </button>

          <button type="button" onclick="switchToRegister()" class="text-xs text-cyan-400 font-semibold hover:text-cyan-300 transition-colors">Don't have an account? <span class="underline">Register</span></button>
        </div>

        <!-- REGISTER FORM -->
        <div id="registerFormWrapper" class="form-wrapper hidden-form flex flex-col items-center w-full">
          <h2 class="text-2xl font-extrabold text-white mb-1">Create Account</h2>
          <p class="text-slate-500 text-xs mb-6">Join Habib iFix community</p>

          <p id="regMessage" class="hidden text-xs text-center font-medium mb-4 p-2 rounded-lg border w-full"></p>

          <div class="relative w-full mb-3">
            <input type="text" id="regName" placeholder="Full Name" required class="neu-input w-full px-4 py-3 pl-10 text-white placeholder-slate-500 text-sm">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm">👤</span>
          </div>
          <div class="relative w-full mb-3">
            <input type="email" id="regEmail" placeholder="Email Address" required class="neu-input w-full px-4 py-3 pl-10 text-white placeholder-slate-500 text-sm">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm">✉️</span>
          </div>
          <div class="relative w-full mb-4">
            <input type="password" id="regPassword" placeholder="Password (min 6 chars)" required minlength="6" class="neu-input w-full px-4 py-3 pl-10 text-white placeholder-slate-500 text-sm">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm">🔒</span>
          </div>

          <button type="submit" form="registerForm" class="btn-glossy w-full text-white font-bold py-3 rounded-xl text-sm tracking-wide mb-4">Create Account</button>

          <div class="flex items-center gap-3 w-full my-3">
            <div class="flex-1 h-px bg-white/10"></div>
            <span class="text-slate-500 text-[10px] uppercase tracking-wider">or continue with</span>
            <div class="flex-1 h-px bg-white/10"></div>
          </div>

          <button type="button" onclick="loginWithGoogle()" class="social-btn w-full py-2.5 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center gap-2 text-xs text-slate-300 hover:bg-white/10 hover:border-white/20 mb-4">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google"> Google
          </button>

          <button type="button" onclick="switchToLogin()" class="text-xs text-cyan-400 font-semibold hover:text-cyan-300 transition-colors">Already have an account? <span class="underline">Login</span></button>
        </div>

        <!-- PHONE AUTH FORM -->
        <div id="phoneFormWrapper" class="form-wrapper hidden-form flex flex-col items-center w-full">
          <h2 class="text-2xl font-extrabold text-white mb-1">Phone Login</h2>
          <p class="text-slate-500 text-xs mb-6">Verify with OTP</p>
          <p id="phoneMessage" class="hidden text-xs text-center font-medium mb-4 p-2 rounded-lg border w-full"></p>

          <div id="phoneInputSection" class="w-full">
            <div class="flex gap-2 mb-4">
              <select id="countryCode" class="neu-input px-2 py-3 text-white text-xs w-1/3 appearance-none cursor-pointer">
                <option value="+880" class="bg-slate-900">🇧 +880</option>
                <option value="+91" class="bg-slate-900">🇮 +91</option>
                <option value="+1" class="bg-slate-900">🇺🇸 +1</option>
              </select>
              <input type="tel" id="phoneNumber" placeholder="18XXXXXXXX" class="neu-input w-2/3 px-3 py-3 text-white placeholder-slate-500 text-xs">
            </div>
            <div id="recaptcha-container" class="mb-4 flex justify-center scale-75 origin-center"></div>
            <button id="sendOtpBtn" class="btn-glossy w-full text-white font-bold py-3 rounded-xl text-xs tracking-wide">Send OTP</button>
          </div>

          <div id="otpInputSection" class="w-full hidden">
            <p class="text-slate-400 text-xs text-center mb-3">Enter the 6-digit code</p>
            <input type="text" id="otpCode" placeholder="• • • • • •" maxlength="6" class="neu-input w-full px-4 py-3 text-white text-center tracking-[0.5em] text-xl font-bold mb-4">
            <button id="verifyOtpBtn" class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-white font-bold py-3 rounded-xl text-xs tracking-wide shadow-lg">Verify & Login</button>
          </div>

          <button type="button" onclick="togglePhoneAuth()" class="mt-4 text-xs text-slate-500 hover:text-cyan-400 transition-colors flex items-center gap-1">← Back to Email Login</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Back to Home -->
  <div class="text-center mt-8 z-20">
    <a href="index.html" class="text-sm text-slate-500 hover:text-cyan-400 transition-colors flex justify-center items-center gap-2 group">
      <span class="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center group-hover:bg-cyan-500/20 group-hover:border-cyan-500/30 transition-all text-xs">←</span>
      Back to Home
    </a>
  </div>

  <!-- Hidden Forms for submission logic -->
  <form id="loginForm" class="hidden"></form>
  <form id="registerForm" class="hidden"></form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, RecaptchaVerifier, signInWithPhoneNumber, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyAaLdtzOIZVYB-Bdc42CXm2T8iclWLc4o0", authDomain: "habib-yt.firebaseapp.com", projectId: "habib-yt", storageBucket: "habib-yt.firebasestorage.app", messagingSenderId: "656628491244", appId: "1:656628491244:web:e01ccd42bd8a2b1b4c96c9", measurementId: "G-GNY1T88D34" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // ===== ANIMATION LOGIC =====
    const character = document.getElementById('character');
    const briefcase = document.getElementById('briefcase');
    let isFormOpen = false;

    // Trigger walk-in on load
    setTimeout(() => {
      character.classList.add('walk-in');
    }, 500);

    // After walking in, go idle, then open briefcase
    setTimeout(() => {
      character.classList.remove('walk-in');
      character.classList.add('idle');
      
      // Kick animation to open briefcase
      setTimeout(() => {
        character.classList.remove('idle');
        character.classList.add('kick');
        
        setTimeout(() => {
          briefcase.classList.add('open');
          isFormOpen = true;
          // Reset character pose after kick
          setTimeout(() => {
             character.classList.remove('kick');
             character.style.transform = "translateX(40px) rotate(20deg)"; // Stay in kicked position
          }, 600);
        }, 300); // Sync with kick peak
      }, 1000);
    }, 2500); // Wait for walk-in (2s) + buffer

    // Switch Forms Logic
    window.switchToRegister = function() {
      if(!isFormOpen) return;
      document.getElementById('loginFormWrapper').classList.add('hidden-form');
      document.getElementById('registerFormWrapper').classList.remove('hidden-form');
      document.getElementById('phoneFormWrapper').classList.add('hidden-form');
    };

    window.switchToLogin = function() {
      if(!isFormOpen) return;
      document.getElementById('registerFormWrapper').classList.add('hidden-form');
      document.getElementById('loginFormWrapper').classList.remove('hidden-form');
      document.getElementById('phoneFormWrapper').classList.add('hidden-form');
    };

    window.togglePhoneAuth = function() {
      if(!isFormOpen) return;
      const loginWrap = document.getElementById('loginFormWrapper');
      const phoneWrap = document.getElementById('phoneFormWrapper');
      
      if(phoneWrap.classList.contains('hidden-form')) {
        loginWrap.classList.add('hidden-form');
        phoneWrap.classList.remove('hidden-form');
        if(!window.recaptchaVerifier) {
          try { window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {'size': 'normal', 'theme': 'dark'}); window.recaptchaVerifier.render(); } catch(e){}
        }
      } else {
        phoneWrap.classList.add('hidden-form');
        loginWrap.classList.remove('hidden-form');
      }
    };

    // ===== AUTH LOGIC =====
    const ALLOWED_ADMIN = "tec.habiburrahman@gmail.com".toLowerCase();
    const urlParams = new URLSearchParams(window.location.search);
    const returnUrl = urlParams.get('return') || 'index.html';

    function showMessage(id, msg, type) {
      type = type || 'error';
      var el = document.getElementById(id);
      el.innerText = msg;
      el.className = `text-xs text-center font-medium mb-4 p-2 rounded-lg border w-full ${type === 'error' ? 'text-red-400 bg-red-500/10 border-red-500/20' : 'text-green-400 bg-green-500/10 border-green-500/20'}`;
      el.classList.remove('hidden');
    }

    function handleLoginSuccess(user, msgId) {
      if(user.email && user.email.toLowerCase() === ALLOWED_ADMIN) {
        showMessage(msgId, "✅ Admin verified! Redirecting...", "success");
        sessionStorage.setItem('isAdmin', 'true');
        setTimeout(() => window.location.href = 'admin.html', 1200);
      } else {
        showMessage(msgId, "✅ Login successful! Redirecting...", "success");
        setTimeout(() => window.location.href = returnUrl, 1200);
      }
    }

    window.loginWithGoogle = function() {
      signInWithPopup(auth, googleProvider).then(result => {
        handleLoginSuccess(result.user, isFormOpen && !document.getElementById('registerFormWrapper').classList.contains('hidden-form') ? 'regMessage' : 'loginMessage');
      }).catch(err => {
        showMessage(isFormOpen && !document.getElementById('registerFormWrapper').classList.contains('hidden-form') ? 'regMessage' : 'loginMessage', "Google Error: " + err.message);
      });
    };

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
        .then(res => handleLoginSuccess(res.user, 'loginMessage'))
        .catch(err => showMessage('loginMessage', "❌ Login Failed: " + err.message));
    });

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPassword').value;
      if(pass.length < 6) return showMessage('regMessage', "❌ Password must be at least 6 characters.");
      
      createUserWithEmailAndPassword(auth, email, pass)
        .then(res => updateProfile(res.user, { displayName: name }).then(() => handleLoginSuccess(res.user, 'regMessage')))
        .catch(err => showMessage('regMessage', "❌ Sign Up Failed: " + err.message));
    });

    document.getElementById('sendOtpBtn').addEventListener('click', () => {
      const fullNumber = document.getElementById('countryCode').value + document.getElementById('phoneNumber').value;
      if(fullNumber.length < 10) return showMessage('phoneMessage', "❌ Invalid phone number.");
      const btn = document.getElementById('sendOtpBtn');
      btn.innerHTML = '<span class="animate-pulse">⏳ Sending...</span>'; btn.disabled = true;

      signInWithPhoneNumber(auth, fullNumber, window.recaptchaVerifier)
        .then(conf => {
          window.confirmationResult = conf;
          document.getElementById('phoneInputSection').classList.add('hidden');
          document.getElementById('otpInputSection').classList.remove('hidden');
          showMessage('phoneMessage', "✅ OTP Sent!", "success");
          btn.innerHTML = 'Send OTP'; btn.disabled = false;
        }).catch(err => {
          showMessage('phoneMessage', "❌ SMS Failed: " + err.message);
          btn.innerHTML = 'Send OTP'; btn.disabled = false;
          try { if(window.recaptchaVerifier) window.recaptchaVerifier.reset(); } catch(e){}
        });
    });

    document.getElementById('verifyOtpBtn').addEventListener('click', () => {
      const code = document.getElementById('otpCode').value.trim();
      if(!code || code.length < 6) return showMessage('phoneMessage', " Enter full 6-digit OTP.");
      const btn = document.getElementById('verifyOtpBtn');
      btn.innerHTML = '<span class="animate-pulse">⏳ Verifying...</span>'; btn.disabled = true;

      window.confirmationResult.confirm(code)
        .then(res => handleLoginSuccess(res.user, 'phoneMessage'))
        .catch(err => { showMessage('phoneMessage', "❌ Invalid OTP!"); btn.innerHTML = 'Verify & Login'; btn.disabled = false; });
    });
  </script>
</body>
</html>
