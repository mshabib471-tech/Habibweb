<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-en="Sign In / Sign Up - Habib iFix" data-bn="সাইন ইন / সাইন আপ - হাবিব আইফিক্স">Sign In / Sign Up - Habib iFix</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        html, body { 
            width: 100%; 
            max-width: 100%; 
            overflow-x: hidden !important; 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311045 100%);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        
        .glass-3d {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .blob { 
            position: absolute; 
            border-radius: 50%; 
            filter: blur(100px); 
            z-index: -1; 
            opacity: 0.5; 
            pointer-events: none; 
        }
        .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: #4f46e5; }
        .blob-2 { top: 30%; right: -10%; width: 500px; height: 500px; background: #9333ea; }
        .blob-3 { bottom: 10%; left: 20%; width: 450px; height: 450px; background: #06b6d4; }
    </style>
</head>
<body class="antialiased relative selection:bg-indigo-500 selection:text-white flex flex-col min-h-screen">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- HEADER / NAVBAR -->
    <header class="fixed top-0 left-0 w-full z-50 py-3 px-4 sm:px-8 md:px-12 flex justify-between items-center glass-3d border-b border-white/10">
        <a href="index.html" class="flex items-center gap-2.5">
            <div class="w-9 h-9 sm:w-10 sm:h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-lg sm:text-xl shadow-lg shadow-indigo-500/30">H</div>
            <div class="leading-tight">
                <h1 class="font-bold text-white text-xs sm:text-sm">Habib <span class="text-indigo-400">iFix</span></h1>
                <p class="text-[9px] sm:text-[10px] text-slate-400 font-medium tracking-wide">Trusted Mobile Technician</p>
            </div>
        </a>
        <a href="index.html" class="glass-3d bg-white/10 px-4 py-2 rounded-full font-semibold text-xs text-white hover:bg-white/20 transition-colors">
            <i class="fa-solid fa-house mr-1"></i> Home
        </a>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow flex items-center justify-center px-4 pt-28 pb-16">
        <div class="glass-3d w-full max-w-md p-8 sm:p-10 rounded-[35px] shadow-2xl border border-white/20 relative overflow-hidden text-center">
            
            <!-- VIEW 1: SPLASH SCREEN -->
            <div id="splashScreen" class="py-8 flex flex-col items-center justify-between min-h-[380px]">
                <div class="my-auto">
                    <div class="w-24 h-24 bg-gradient-to-tr from-indigo-600 to-purple-600 text-white rounded-[32px] flex items-center justify-center text-5xl font-extrabold mx-auto mb-6 shadow-2xl shadow-indigo-600/50 border border-white/20">
                        H
                    </div>
                    <h2 class="text-3xl font-extrabold text-white tracking-wide mb-2">Habib <span class="text-indigo-400">iFix</span></h2>
                    <p class="text-xs text-slate-400 max-w-xs mx-auto">Your trusted partner for all mobile repair and online technical solutions.</p>
                </div>

                <div class="w-full space-y-3 mt-8">
                    <button onclick="showAuthForm('signin')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-2xl text-xs transition-all shadow-lg shadow-indigo-600/30">
                        Sign In
                    </button>
                    <button onclick="showAuthForm('signup')" class="w-full glass-3d bg-white/10 hover:bg-white/20 text-white font-bold py-3.5 rounded-2xl text-xs transition-all border border-white/20">
                        Create Account
                    </button>
                </div>
            </div>

            <!-- ALERT MESSAGE -->
            <div id="authAlert" class="hidden mb-6 p-3 rounded-xl text-xs text-center font-medium"></div>

            <!-- VIEW 2: SIGN IN FORM -->
            <form id="signInForm" onsubmit="handleSignIn(event)" class="space-y-4 text-left hidden">
                <div class="flex items-center justify-between mb-4">
                    <button type="button" onclick="backToSplash()" class="text-xs text-indigo-400 hover:text-white flex items-center gap-1.5"><i class="fa-solid fa-arrow-left"></i> Back</button>
                    <h3 class="text-lg font-bold text-white">Sign In</h3>
                    <div class="w-8"></div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase mb-1">Email Address</label>
                    <input type="email" id="siEmail" required placeholder="nathan.roberts@example.com" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-xs text-white outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[11px] font-bold text-slate-300 uppercase">Password</label>
                        <button type="button" onclick="handleForgotPassword()" class="text-[10px] text-indigo-400 hover:underline">Forgot Password?</button>
                    </div>
                    <div class="relative">
                        <input type="password" id="siPassword" required placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-xs text-white outline-none focus:border-indigo-500 transition-colors pr-10">
                        <button type="button" onclick="togglePassword('siPassword', this)" class="absolute right-3.5 top-3 text-slate-400 hover:text-white text-xs">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-2xl text-xs transition-all shadow-lg shadow-indigo-600/30">
                    Sign In
                </button>
                <div class="relative my-3 text-center">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
                    <span class="relative px-3 bg-slate-900/40 text-[10px] uppercase text-slate-400 font-semibold">Or</span>
                </div>
                <button type="button" onclick="handleGoogleLogin()" class="w-full glass-3d bg-white/5 hover:bg-white/10 text-white font-semibold py-3 rounded-2xl text-xs transition-all flex items-center justify-center gap-3 border border-white/10">
                    <i class="fa-brands fa-google text-red-400"></i> Continue with Google
                </button>
                <p class="text-center text-xs text-slate-400 mt-4">
                    Don't have an account? <button type="button" onclick="showAuthForm('signup')" class="text-indigo-400 font-bold hover:underline ml-1">Create Account</button>
                </p>
            </form>

            <!-- VIEW 3: CREATE ACCOUNT FORM -->
            <form id="signUpForm" onsubmit="handleSignUp(event)" class="space-y-3.5 text-left hidden">
                <div class="flex items-center justify-between mb-3">
                    <button type="button" onclick="backToSplash()" class="text-xs text-indigo-400 hover:text-white flex items-center gap-1.5"><i class="fa-solid fa-arrow-left"></i> Back</button>
                    <h3 class="text-lg font-bold text-white">Create Account</h3>
                    <div class="w-8"></div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-300 uppercase mb-1">Full Name</label>
                    <input type="text" id="suName" required placeholder="Md Habibur Rahman" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-2.5 text-xs text-white outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-300 uppercase mb-1">Email Address</label>
                    <input type="email" id="suEmail" required placeholder="nathan.roberts@example.com" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-2.5 text-xs text-white outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-300 uppercase mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="suPassword" required placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-2.5 text-xs text-white outline-none focus:border-indigo-500 transition-colors pr-10">
                        <button type="button" onclick="togglePassword('suPassword', this)" class="absolute right-3.5 top-2.5 text-slate-400 hover:text-white text-xs">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-300 uppercase mb-1">Confirm Password</label>
                    <input type="password" id="suConfirmPassword" required placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-2.5 text-xs text-white outline-none focus:border-indigo-500 transition-colors">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-2xl text-xs transition-all shadow-lg shadow-indigo-600/30">
                    Create Account
                </button>
                <div class="relative my-2 text-center">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
                    <span class="relative px-3 bg-slate-900/40 text-[10px] uppercase text-slate-400 font-semibold">Or</span>
                </div>
                <button type="button" onclick="handleGoogleLogin()" class="w-full glass-3d bg-white/5 hover:bg-white/10 text-white font-semibold py-3 rounded-2xl text-xs transition-all flex items-center justify-center gap-3 border border-white/10">
                    <i class="fa-brands fa-google text-red-400"></i> Continue with Google
                </button>
                <p class="text-center text-xs text-slate-400 mt-3">
                    Already sign in? <button type="button" onclick="showAuthForm('signin')" class="text-indigo-400 font-bold hover:underline ml-1">Sign In</button>
                </p>
            </form>

            <p class="text-center text-[10px] text-slate-500 mt-4">&copy; 2026 Habib iFix. All rights reserved.</p>

        </div>
    </main>

    <!-- FIREBASE & UI LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, sendPasswordResetEmail, 
            signInWithPopup, GoogleAuthProvider 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaLdtzOIZVYB-Bdc42CXm2T8iclWLc4o0",
            authDomain: "habib-yt.firebaseapp.com",
            projectId: "habib-yt",
            storageBucket: "habib-yt.firebasestorage.app",
            messagingSenderId: "656628491244",
            appId: "1:656628491244:web:e01ccd42bd8a2b1b4c96c9",
            measurementId: "G-GNY1T88D34"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        function showAlert(msg, isError = true) {
            const alertBox = document.getElementById('authAlert');
            alertBox.innerText = msg;
            alertBox.className = `mb-4 p-3 rounded-xl text-xs text-center font-medium ${isError ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}`;
            alertBox.classList.remove('hidden');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const returnUrl = urlParams.get('return') || 'index.html';

        window.showAuthForm = function(mode) {
            document.getElementById('splashScreen').classList.add('hidden');
            document.getElementById('authAlert').classList.add('hidden');
            if (mode === 'signin') {
                document.getElementById('signInForm').classList.remove('hidden');
                document.getElementById('signUpForm').classList.add('hidden');
            } else {
                document.getElementById('signUpForm').classList.remove('hidden');
                document.getElementById('signInForm').classList.add('hidden');
            }
        };

        window.backToSplash = function() {
            document.getElementById('splashScreen').classList.remove('hidden');
            document.getElementById('signInForm').classList.add('hidden');
            document.getElementById('signUpForm').classList.add('hidden');
            document.getElementById('authAlert').classList.add('hidden');
        };

        window.handleSignIn = async function(e) {
            e.preventDefault();
            const email = document.getElementById('siEmail').value;
            const password = document.getElementById('siPassword').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                localStorage.setItem('habib_logged_in', 'true');
                localStorage.setItem('habib_user_email', user.email);
                localStorage.setItem('habib_user_name', user.displayName || user.email.split('@')[0]);
                
                showAlert("Login Successful! Redirecting...", false);
                setTimeout(() => { window.location.href = returnUrl; }, 1000);
            } catch (error) {
                showAlert(error.message);
            }
        };

        window.handleSignUp = async function(e) {
            e.preventDefault();
            const name = document.getElementById('suName').value;
            const email = document.getElementById('suEmail').value;
            const password = document.getElementById('suPassword').value;
            const confirmPassword = document.getElementById('suConfirmPassword').value;

            if (password !== confirmPassword) {
                showAlert("Passwords do not match!");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                await updateProfile(user, { displayName: name });

                localStorage.setItem('habib_logged_in', 'true');
                localStorage.setItem('habib_user_email', user.email);
                localStorage.setItem('habib_user_name', name);

                showAlert("Account Created Successfully! Redirecting...", false);
                setTimeout(() => { window.location.href = returnUrl; }, 1000);
            } catch (error) {
                showAlert(error.message);
            }
        };

        window.handleGoogleLogin = async function() {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;

                localStorage.setItem('habib_logged_in', 'true');
                localStorage.setItem('habib_user_email', user.email);
                localStorage.setItem('habib_user_name', user.displayName || user.email.split('@')[0]);

                showAlert("Google Login Successful! Redirecting...", false);
                setTimeout(() => { window.location.href = returnUrl; }, 1000);
            } catch (error) {
                showAlert(error.message);
            }
        };

        window.handleForgotPassword = async function() {
            const email = document.getElementById('siEmail').value;
            if (!email) {
                showAlert("Please enter your email address first in the email field.");
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                showAlert("Password reset email sent! Check your inbox.", false);
            } catch (error) {
                showAlert(error.message);
            }
        };

        window.togglePassword = function(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            } else {
                input.type = "password";
                btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            }
        };
    </script>
</body>
</html>
