<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - Repair Guy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-slate-200 bg-[#0f172a] relative flex flex-col items-center justify-center py-10 px-4">
  
  <div class="fixed inset-0 z-[-1] overflow-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-blue-900/20 blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-[#9E1B32]/20 blur-[150px]"></div>
  </div>

  <div class="max-w-[420px] w-full bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-[32px] shadow-2xl transition-all duration-500">
    
    <!-- ================= MAIN TAB (USER vs ADMIN) ================= -->
    <div class="flex bg-white/5 border border-white/10 rounded-xl p-1 mb-8">
        <button id="tabUserLogin" onclick="switchMainTab('user')" class="flex-1 py-2 text-sm font-bold rounded-lg bg-rose-600 text-white transition-all shadow-md">User Portal</button>
        <button id="tabAdminLogin" onclick="switchMainTab('admin')" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all">Admin Portal</button>
    </div>

    <!-- Error/Success Message -->
    <p id="authMessage" class="hidden text-sm text-center font-medium mb-4 p-3 rounded-lg border"></p>

    <!-- ================= 1. USER PORTAL ================= -->
    <div id="userPortalSection">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-white">Join the Community</h2>
            <p class="text-slate-400 text-sm mt-1">Login to like, comment & manage profile.</p>
        </div>

        <button onclick="loginWithGoogle('user')" class="flex items-center justify-center gap-3 w-full bg-white text-slate-800 font-bold py-3 rounded-xl transition-all shadow-lg hover:-translate-y-0.5 mb-6">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Continue with Google
        </button>

        <div class="flex items-center gap-4 mb-6">
            <div class="h-px bg-white/10 flex-grow"></div>
            <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">OR</span>
            <div class="h-px bg-white/10 flex-grow"></div>
        </div>

        <div class="flex border-b border-white/10 mb-6">
            <button id="subTabEmail" onclick="switchUserTab('email')" class="flex-1 pb-2 text-sm font-bold border-b-2 border-rose-500 text-white transition-all">Email & Pass</button>
            <button id="subTabPhone" onclick="switchUserTab('phone')" class="flex-1 pb-2 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-white transition-all">Phone OTP</button>
        </div>

        <!-- User Email Form -->
        <form id="userEmailForm" class="space-y-4">
            <input type="email" id="userEmail" required placeholder="Email Address" class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white focus:border-rose-400 outline-none">
            <input type="password" id="userPassword" required placeholder="Password (Min 6 chars)" class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white focus:border-rose-400 outline-none">
            
            <div class="flex gap-3 pt-2">
                <button type="submit" id="userLoginBtn" class="flex-1 bg-[#9E1B32]/90 hover:bg-[#9E1B32] text-white font-bold py-3.5 rounded-xl shadow-[0_0_15px_rgba(158,27,50,0.3)] transition-all">Login</button>
                <button type="button" id="userRegisterBtn" class="flex-1 bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-3.5 rounded-xl transition-all">Create Account</button>
            </div>
        </form>

        <!-- User Phone Form -->
        <div id="userPhoneForm" class="space-y-4 hidden">
            <div id="phoneInputSection">
                <label class="block text-xs font-medium text-slate-400 mb-1">Select Country & Enter Number</label>
                <div class="flex gap-2 mb-3">
                    <select id="countryCode" class="bg-[#0f172a]/50 border border-white/10 rounded-xl px-3 py-3 text-white focus:border-rose-400 outline-none w-1/3">
                        <option value="+880">🇧🇩 +880</option>
                        <option value="+91">🇮🇳 +91</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+971">🇦🇪 +971</option>
                    </select>
                    <input type="tel" id="phoneNumber" placeholder="18XXXXXXXX" class="w-2/3 bg-[#0f172a]/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-rose-400 outline-none">
                </div>
                <div id="recaptcha-container" class="mb-3 flex justify-center"></div>
                <button id="sendOtpBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg">Send OTP Code</button>
            </div>

            <div id="otpInputSection" class="hidden">
                <input type="text" id="otpCode" placeholder="Enter 6-digit OTP" class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white text-center tracking-widest text-lg font-bold outline-none mb-4">
                <button id="verifyOtpBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg">Verify & Login</button>
            </div>
        </div>
    </div>

    <!-- ================= 2. ADMIN PORTAL ================= -->
    <div id="adminPortalSection" class="hidden">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-white">Admin Portal</h2>
            <p class="text-slate-400 text-sm mt-1">Strictly Authorized Access Only.</p>
        </div>

        <button onclick="loginWithGoogle('admin')" class="flex items-center justify-center gap-3 w-full bg-white text-slate-800 font-bold py-3 rounded-xl transition-all shadow-lg hover:-translate-y-0.5 mb-6">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Admin Google Login
        </button>

        <div class="flex items-center gap-4 mb-6">
            <div class="h-px bg-white/10 flex-grow"></div>
            <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">OR</span>
            <div class="h-px bg-white/10 flex-grow"></div>
        </div>

        <form id="adminEmailForm" class="space-y-4">
            <input type="email" id="adminEmail" required placeholder="Admin Email" class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white outline-none">
            <input type="password" id="adminPassword" required placeholder="Admin Password" class="w-full bg-[#0f172a]/50 border border-white/10 rounded-xl px-5 py-3 text-white outline-none">
            <button type="submit" class="w-full bg-[#9E1B32]/90 hover:bg-[#9E1B32] text-white font-bold py-3.5 rounded-xl shadow-lg transition-all mt-2">Login to Dashboard</button>
        </form>
    </div>

    <div class="text-center mt-8">
      <a href="index.html" class="text-sm text-slate-400 hover:text-rose-400 transition-colors flex justify-center items-center gap-1"><i data-feather="arrow-left" class="w-4 h-4"></i> Back to Website</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, RecaptchaVerifier, signInWithPhoneNumber, signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAaLdtzOIZVYB-Bdc42CXm2T8iclWLc4o0",
      authDomain: "habib-yt.firebaseapp.com",
      projectId: "habib-yt",
      storageBucket: "habib-yt.firebasestorage.app",
      messagingSenderId: "656628491244",
      appId: "1:656628491244:web:e01ccd42bd8a2b1b4c96c9",
      measurementId: "G-GNY1T88D34"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();
    feather.replace();

    const ALLOWED_ADMIN = "tec.habiburrahman@gmail.com".toLowerCase();
    
    // Find where to redirect after login (default is index.html)
    const urlParams = new URLSearchParams(window.location.search);
    const returnUrl = urlParams.get('return') || 'index.html';

    // UI Helpers
    const authMessage = document.getElementById('authMessage');
    function showMessage(msg, type = 'error') {
        authMessage.innerText = msg;
        authMessage.className = `text-sm text-center font-medium mb-4 p-3 rounded-lg border ${type === 'error' ? 'text-red-400 bg-red-500/10 border-red-500/20' : 'text-green-400 bg-green-500/10 border-green-500/20'}`;
    }

    // Success Logic
    function handleLoginSuccess(user, role) {
        if (role === 'admin') {
            if (user.email && user.email.toLowerCase() === ALLOWED_ADMIN) {
                showMessage("Admin verified! Redirecting...", "success");
                sessionStorage.setItem('isAdmin', 'true');
                setTimeout(() => window.location.href = 'admin.html', 1000);
            } else {
                signOut(auth);
                showMessage("Access Denied! Only Admin can login here.", "error");
            }
        } else {
            // Check if user accidentally logged in as admin through user portal
            if(user.email && user.email.toLowerCase() === ALLOWED_ADMIN) {
                sessionStorage.setItem('isAdmin', 'true');
            }
            showMessage("Login successful! Redirecting...", "success");
            setTimeout(() => window.location.href = returnUrl, 1000);
        }
    }

    // Google Login (Shared)
    window.loginWithGoogle = function(role) {
        signInWithPopup(auth, googleProvider).then(result => {
            handleLoginSuccess(result.user, role);
        }).catch(err => showMessage(err.message));
    }

    // Tab Switching
    window.switchMainTab = function(tab) {
        document.getElementById('userPortalSection').style.display = tab === 'user' ? 'block' : 'none';
        document.getElementById('adminPortalSection').style.display = tab === 'admin' ? 'block' : 'none';
        
        document.getElementById('tabUserLogin').className = tab === 'user' ? 'flex-1 py-2 text-sm font-bold rounded-lg bg-rose-600 text-white transition-all shadow-md' : 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all';
        document.getElementById('tabAdminLogin').className = tab === 'admin' ? 'flex-1 py-2 text-sm font-bold rounded-lg bg-rose-600 text-white transition-all shadow-md' : 'flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 hover:text-white transition-all';
        authMessage.classList.add('hidden');
    }

    window.switchUserTab = function(tab) {
        document.getElementById('userEmailForm').style.display = tab === 'email' ? 'block' : 'none';
        document.getElementById('userPhoneForm').style.display = tab === 'phone' ? 'block' : 'none';
        
        document.getElementById('subTabEmail').className = tab === 'email' ? 'flex-1 pb-2 text-sm font-bold border-b-2 border-rose-500 text-white transition-all' : 'flex-1 pb-2 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-white transition-all';
        document.getElementById('subTabPhone').className = tab === 'phone' ? 'flex-1 pb-2 text-sm font-bold border-b-2 border-rose-500 text-white transition-all' : 'flex-1 pb-2 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-white transition-all';
        
        if(tab === 'phone' && !window.recaptchaVerifier) {
            window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {'size': 'normal'});
            window.recaptchaVerifier.render();
        }
        authMessage.classList.add('hidden');
    }

    // Admin Form Submit
    document.getElementById('adminEmailForm').addEventListener('submit', (e) => {
        e.preventDefault();
        signInWithEmailAndPassword(auth, document.getElementById('adminEmail').value, document.getElementById('adminPassword').value)
            .then(res => handleLoginSuccess(res.user, 'admin'))
            .catch(err => showMessage("Admin Login Failed: " + err.message));
    });

    // User Email Form Submit
    document.getElementById('userEmailForm').addEventListener('submit', (e) => {
        e.preventDefault();
        signInWithEmailAndPassword(auth, document.getElementById('userEmail').value, document.getElementById('userPassword').value)
            .then(res => handleLoginSuccess(res.user, 'user'))
            .catch(err => showMessage("Login Failed: " + err.message));
    });

    document.getElementById('userRegisterBtn').addEventListener('click', () => {
        const email = document.getElementById('userEmail').value;
        const pass = document.getElementById('userPassword').value;
        if(!email || pass.length < 6) return showMessage("Provide email and min 6 char password.");
        
        createUserWithEmailAndPassword(auth, email, pass)
            .then(res => handleLoginSuccess(res.user, 'user'))
            .catch(err => showMessage("Sign Up Failed: " + err.message));
    });

    // Phone Auth
    document.getElementById('sendOtpBtn').addEventListener('click', () => {
        const fullNumber = document.getElementById('countryCode').value + document.getElementById('phoneNumber').value;
        if (fullNumber.length < 10) return showMessage("Invalid phone number.");

        signInWithPhoneNumber(auth, fullNumber, window.recaptchaVerifier)
            .then((conf) => {
                window.confirmationResult = conf;
                document.getElementById('phoneInputSection').classList.add('hidden');
                document.getElementById('otpInputSection').classList.remove('hidden');
                showMessage("OTP Sent!", "success");
            }).catch(err => {
                showMessage("SMS Failed: " + err.message);
                if (window.recaptchaVerifier) window.recaptchaVerifier.render();
            });
    });

    document.getElementById('verifyOtpBtn').addEventListener('click', () => {
        const code = document.getElementById('otpCode').value;
        window.confirmationResult.confirm(code)
            .then(res => handleLoginSuccess(res.user, 'user'))
            .catch(err => showMessage("Invalid OTP!"));
    });
  </script>
</body>
</html>
