<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - Habib iFix</title>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6358115896801136" crossorigin="anonymous"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background: #eef2f6;
    }

    /* Soft UI / Neumorphism Shadows */
    .soft-ui-card {
      background: #eef2f6;
      box-shadow: 20px 20px 60px #d1d9e6, -20px -20px 60px #ffffff;
    }

    .soft-ui-input {
      background: #eef2f6;
      border: none;
      box-shadow: inset 6px 6px 12px #d1d9e6, inset -6px -6px 12px #ffffff;
      transition: all 0.3s ease;
    }
    .soft-ui-input:focus {
      outline: none;
      box-shadow: inset 8px 8px 16px #d1d9e6, inset -8px -8px 16px #ffffff;
    }

    .soft-ui-btn {
      background: #eef2f6;
      box-shadow: 6px 6px 12px #d1d9e6, -6px -6px 12px #ffffff;
      transition: all 0.2s ease;
    }
    .soft-ui-btn:hover {
      transform: translateY(-1px);
      box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
    }
    .soft-ui-btn:active {
      box-shadow: inset 4px 4px 8px #d1d9e6, inset -4px -4px 8px #ffffff;
      transform: translateY(0);
    }

    .soft-ui-icon-btn {
      background: #eef2f6;
      box-shadow: 4px 4px 8px #d1d9e6, -4px -4px 8px #ffffff;
      transition: all 0.2s ease;
    }
    .soft-ui-icon-btn:hover {
      transform: translateY(-2px);
      box-shadow: 6px 6px 12px #d1d9e6, -6px -6px 12px #ffffff;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float { animation: float 4s ease-in-out infinite; }

    /* ===== SLIDING PANEL CSS ===== */
    .container-slider { position: relative; overflow: hidden; }
    .form-container { position: absolute; top: 0; height: 100%; transition: all 0.6s ease-in-out; }
    .sign-in-container { left: 0; width: 50%; z-index: 2; opacity: 1; pointer-events: auto; }
    .container-slider.right-panel-active .sign-in-container { transform: translateX(100%); opacity: 0; pointer-events: none; }
    .sign-up-container { left: 0; width: 50%; opacity: 0; z-index: 1; pointer-events: none; }
    .container-slider.right-panel-active .sign-up-container { transform: translateX(100%); opacity: 1; z-index: 5; animation: show 0.6s; pointer-events: auto; }
    @keyframes show { 0%,49.99%{opacity:0;z-index:1}50%,100%{opacity:1;z-index:5} }
    .overlay-container { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; overflow: hidden; transition: transform 0.6s ease-in-out; z-index: 100; }
    .container-slider.right-panel-active .overlay-container { transform: translateX(-100%); }
    .overlay { position: absolute; top: 0; left: -100%; width: 200%; height: 100%; background: linear-gradient(135deg, #0891b2, #7c3aed); color: #fff; transition: transform 0.6s ease-in-out; }
    .container-slider.right-panel-active .overlay { transform: translateX(50%); }
    .overlay-panel { position: absolute; top: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 40px; height: 100%; width: 50%; text-align: center; transition: transform 0.6s ease-in-out; }
    .overlay-left { transform: translateX(-20%); }
    .container-slider.right-panel-active .overlay-left { transform: translateX(0); }
    .overlay-right { right: 0; transform: translateX(0); }
    .container-slider.right-panel-active .overlay-right { transform: translateX(20%); }

    @media (max-width: 768px) {
      .sign-in-container, .sign-up-container { width: 100%; left: 0; }
      .overlay-container { display: none; }
      .container-slider.right-panel-active .sign-in-container { transform: none; opacity: 0; pointer-events: none; }
      .container-slider.right-panel-active .sign-up-container { transform: none; opacity: 1; pointer-events: all; }
      .sign-up-container { transform: none; }
      .mobile-toggle { display: block !important; }
    }
    @media (min-width: 769px) { .mobile-toggle { display: none !important; } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Main Card -->
  <div class="soft-ui-card w-full max-w-[420px] rounded-[40px] p-8 md:p-10 relative overflow-hidden">
    
    <!-- Top Icon -->
    <div class="flex justify-center mb-6 animate-float">
      <div class="w-16 h-16 rounded-full bg-[#eef2f6] shadow-[8px_8px_16px_#d1d9e6,-8px_-8px_16px_#ffffff] flex items-center justify-center">
        <svg class="w-8 h-8 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      </div>
    </div>

    <!-- Header Text -->
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-slate-700 mb-1">Welcome back</h2>
      <p class="text-sm text-slate-400">Please sign in to continue</p>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-6">
      
      <!-- Email Input -->
      <div class="relative">
        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </div>
        <input type="email" id="loginEmail" placeholder="Email address" required class="soft-ui-input w-full pl-12 pr-4 py-3.5 rounded-xl text-slate-600 placeholder-slate-400 text-sm">
      </div>

      <!-- Password Input -->
      <div class="relative">
        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <input type="password" id="loginPassword" placeholder="Password" required class="soft-ui-input w-full pl-12 pr-12 py-3.5 rounded-xl text-slate-600 placeholder-slate-400 text-sm">
        <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-cyan-600 transition-colors focus:outline-none">
          <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        </button>
      </div>

      <!-- Options Row -->
      <div class="flex items-center justify-between px-1">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-cyan-600 focus:ring-cyan-500 accent-cyan-600">
          <span class="text-xs text-slate-500 font-medium">Remember me</span>
        </label>
        <a href="contact.html" class="text-xs text-slate-500 hover:text-cyan-600 transition-colors font-medium">Forgot password?</a>
      </div>

      <!-- Sign In Button -->
      <button type="submit" id="submitBtn" class="soft-ui-btn w-full py-3.5 rounded-xl text-slate-700 font-bold text-sm tracking-wide mt-2">
        Sign In
      </button>

      <!-- Divider -->
      <div class="relative flex items-center justify-center my-6">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
        <div class="relative bg-[#eef2f6] px-4 text-xs text-slate-400 uppercase tracking-widest font-medium">Or continue with</div>
      </div>

      <!-- Social Buttons -->
      <div class="flex justify-center gap-4">
        <button type="button" onclick="loginWithGoogle()" class="soft-ui-icon-btn w-12 h-12 rounded-full flex items-center justify-center text-slate-600 hover:text-blue-600">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        </button>
        <button type="button" class="soft-ui-icon-btn w-12 h-12 rounded-full flex items-center justify-center text-slate-600 hover:text-slate-900 opacity-60 cursor-not-allowed">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        </button>
        <button type="button" class="soft-ui-icon-btn w-12 h-12 rounded-full flex items-center justify-center text-slate-600 hover:text-blue-400 opacity-60 cursor-not-allowed">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
        </button>
      </div>

      <!-- Footer Link -->
      <p class="text-center text-xs text-slate-400 mt-6">
        Don't have an account? <a href="#" class="text-slate-700 font-semibold hover:text-cyan-600 transition-colors">Sign up</a>
      </p>

      <!-- Status Message -->
      <div id="loginMessage" class="hidden text-xs text-center font-medium p-3 rounded-xl border mt-4"></div>

    </form>
  </div>

  <!-- Back to Home -->
  <div class="fixed bottom-6 left-6 z-50">
    <a href="index.html" class="soft-ui-icon-btn w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:text-cyan-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    </a>
  </div>

  <!-- ================= JAVASCRIPT ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAaLdtzOIZVYB-Bdc42CXm2T8iclWLc4o0",
      authDomain: "habib-yt.firebaseapp.com",
      projectId: "habib-yt",
      storageBucket: "habib-yt.firebasestorage.app",
      messagingSenderId: "656628491244",
      appId: "1:656628491244:web:e01ccd42bd8a2b1b4c96c9",
      measurementId: "G-GNY1T88D34"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // Toggle Password Visibility
    window.togglePassword = function() {
      var input = document.getElementById('loginPassword');
      var icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
      }
    };

    // Show Message Helper
    function showMessage(msg, type) {
      var el = document.getElementById('loginMessage');
      el.innerText = msg;
      el.classList.remove('hidden');
      if(type === 'success') {
        el.className = "text-xs text-center font-medium p-3 rounded-xl border mt-4 text-green-600 bg-green-50 border-green-200";
      } else {
        el.className = "text-xs text-center font-medium p-3 rounded-xl border mt-4 text-red-500 bg-red-50 border-red-200";
      }
    }

    // Google Login
    window.loginWithGoogle = function() {
      signInWithPopup(auth, googleProvider).then(function(result) {
        showMessage("✅ Login successful! Redirecting...", "success");
        setTimeout(function(){ window.location.href = 'index.html'; }, 1500);
      }).catch(function(err) {
        showMessage("❌ Error: " + err.message);
      });
    };

    // Email Login
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var originalText = btn.innerText;
      btn.innerText = 'Signing in...';
      btn.disabled = true;

      var email = document.getElementById('loginEmail').value;
      var pass = document.getElementById('loginPassword').value;

      signInWithEmailAndPassword(auth, email, pass)
        .then(function(res){ 
          showMessage("✅ Login successful! Redirecting...", "success");
          setTimeout(function(){ window.location.href = 'index.html'; }, 1500);
        })
        .catch(function(err){ 
          showMessage("❌ " + err.message);
          btn.innerText = originalText;
          btn.disabled = false;
        });
    });
  </script>
</body>
</html>
