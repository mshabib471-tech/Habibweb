<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <!-- Chrome Extension Compatibility & Window Error Guard -->
    <script>
      (function() {
        window.addEventListener("error", function(e) {
          if ((e.filename && e.filename.indexOf("chrome-extension://") !== -1) ||
              (e.message && e.message.indexOf("fetch of #<Window>") !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        try {
          var _f = window.fetch;
          Object.defineProperty(window, "fetch", {
            get: function() { return _f; },
            set: function(v) { _f = v; },
            configurable: true,
            enumerable: true
          });
          if (typeof Window !== "undefined" && Window.prototype) {
            Object.defineProperty(Window.prototype, "fetch", {
              get: function() { return _f; },
              set: function(v) { _f = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch(err) {}
      })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - Habib iFix .Tech</title>
    
    <!-- Google Search Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    
    <script>
        tailwind = { darkMode: "class" };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="/js/theme.js"></script>
    <script src="/js/global-layout.js"></script>
    <script type="module" src="/js/site-auth.js"></script>
</head>
<body class="min-h-screen flex flex-col text-slate-900 selection:bg-sky-500 selection:text-white">

    <!-- Global Sidebar Mount -->
    <div id="global-sidebar-root"></div>

    <!-- Main Content Wrapper -->
    <div id="mainContent" class="lg:ml-64 transition-all duration-300 flex flex-col min-h-screen">
        <!-- Global Header Mount -->
        <div id="global-header-root"></div>
        <script>if (window.HabibLayout) window.HabibLayout.mount();</script>

        <!-- Main Content Area -->
        <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
            <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 shadow-2xl text-center relative overflow-hidden">
                <div class="absolute -top-20 -right-20 w-44 h-44 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-20 -left-20 w-44 h-44 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Icon Container -->
                <div id="verifIconContainer" class="w-16 h-16 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center mx-auto text-2xl mb-4 border border-sky-200 shadow-xs">
                    <i id="verifIcon" class="fa-solid fa-envelope-circle-check"></i>
                </div>

                <!-- Title & Description -->
                <h1 id="verifTitle" class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight mb-2">
                    ইমেইল ভেরিফিকেশন
                </h1>
                <p id="verifSubtitle" class="text-xs text-slate-600 font-medium mb-6 leading-relaxed">
                    অনুগ্রহ করে অপেক্ষা করুন, আপনার ভেরিফিকেশন কোড যাচাই করা হচ্ছে...
                </p>

                <!-- Status Alert Box -->
                <div id="verifAlert" class="hidden p-3.5 rounded-2xl text-xs font-bold mb-5 border leading-relaxed"></div>

                <!-- Action Buttons -->
                <div id="actionContainer" class="space-y-3">
                    <button id="resendBtn" onclick="handleResendEmail()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-extrabold text-xs shadow-lg shadow-sky-500/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span id="resendBtnText">পুনরায় ভেরিফিকেশন লিংক পাঠান (Resend Email)</span>
                    </button>

                    <button id="checkStatusBtn" onclick="handleCheckStatus()" class="w-full py-2.5 px-4 rounded-xl bg-white hover:bg-slate-50 text-slate-800 border border-slate-200 font-bold text-xs transition-colors flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-rotate text-sky-600"></i>
                        <span>ভেরিফিকেশন স্ট্যাটাস চেক করুন (Check Status)</span>
                    </button>

                    <a href="dashboard.html" id="dashboardBtn" class="hidden w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-gauge"></i>
                        <span>ইউজার ড্যাশবোর্ডে প্রবেশ করুন &rarr;</span>
                    </a>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-200 flex items-center justify-center gap-2 text-[11px] text-slate-600 font-semibold">
                    <img src="/logo.png" alt="Habib iFix" class="w-5 h-5 rounded-md object-contain">
                    <span>𝐇𝐚𝐛𝐢𝐛 𝐢𝐅𝐢𝐱.𝐓𝐞𝐜𝐡 Official Security Guard</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const oobCode = urlParams.get('oobCode');

            const titleEl = document.getElementById('verifTitle');
            const subtitleEl = document.getElementById('verifSubtitle');
            const alertEl = document.getElementById('verifAlert');
            const iconEl = document.getElementById('verifIcon');
            const iconContainer = document.getElementById('verifIconContainer');
            const dashboardBtn = document.getElementById('dashboardBtn');

            // Scenario 1: User arrived via official Firebase Email Action Link
            if (mode === 'verifyEmail' && oobCode) {
                try {
                    // Wait for auth library
                    let attempts = 0;
                    while ((!window.HabibAuth || !window.HabibAuth.verifyEmailActionCode) && attempts < 20) {
                        await new Promise(r => setTimeout(r, 100));
                        attempts++;
                    }

                    await window.HabibAuth.verifyEmailActionCode(oobCode);
                    
                    // Success UI
                    iconContainer.className = "w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto text-3xl mb-4 border border-emerald-200";
                    iconEl.className = "fa-solid fa-circle-check";
                    titleEl.innerText = "ইমেইল সফলভাবে ভেরিফাই হয়েছে!";
                    subtitleEl.innerText = "অভিনন্দন! আপনার 𝐇𝐚𝐛𝐢𝐛 𝐢𝐅𝐢𝐱.𝐓𝐞𝐜𝐡 একাউন্টের ইমেইল ভেরিফিকেশন সফল হয়েছে। এখন আপনি সকল ফিচার ও সার্ভিস ব্যবহার করতে পারবেন।";
                    
                    alertEl.className = "p-3.5 rounded-2xl text-xs font-bold mb-5 border bg-emerald-50 text-emerald-700 border-emerald-200";
                    alertEl.innerHTML = '<i class="fa-solid fa-check"></i> Email verified successfully! You are ready to go.';
                    alertEl.classList.remove('hidden');

                    document.getElementById('resendBtn').classList.add('hidden');
                    document.getElementById('checkStatusBtn').classList.add('hidden');
                    dashboardBtn.classList.remove('hidden');
                } catch (err) {
                    console.error("Action Code Error:", err);
                    iconContainer.className = "w-16 h-16 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center mx-auto text-3xl mb-4 border border-red-200";
                    iconEl.className = "fa-solid fa-triangle-exclamation";
                    titleEl.innerText = "ভেরিফিকেশন লিংকটি মেয়াদোত্তীর্ণ";
                    subtitleEl.innerText = "লিংকটি ইতোমধ্যে ব্যবহার করা হয়েছে অথবা এর মেয়াদ শেষ হয়ে গেছে। নিচের বাটনে ক্লিক করে নতুন ভেরিফিকেশন লিংক গ্রহণ করুন।";

                    alertEl.className = "p-3.5 rounded-2xl text-xs font-bold mb-5 border bg-red-50 text-red-700 border-red-200";
                    alertEl.innerText = err.message || "Invalid or expired verification link.";
                    alertEl.classList.remove('hidden');
                }
            } else {
                // Scenario 2: Normal page visit (e.g. redirected from dashboard to verify)
                if (window.HabibAuth && window.HabibAuth.waitForAuthReady) {
                    await window.HabibAuth.waitForAuthReady();
                }
                const user = window.HabibAuth ? window.HabibAuth.getCurrentUser() : null;
                const email = user ? user.email : (localStorage.getItem('habib_user_email') || 'your email');

                titleEl.innerText = "আপনার ইমেইল ভেরিফাই করুন";
                subtitleEl.innerHTML = `আমরা <strong class="text-sky-600 font-mono">${escapeHtml(email)}</strong> ঠিকানায় একটি ভেরিফিকেশন লিংক পাঠিয়েছি। আপনার ইনবক্স অথবা স্প্যাম (Spam) ফোল্ডার চেক করুন।`;
            }
        });

        async function handleResendEmail() {
            const btn = document.getElementById('resendBtn');
            const btnText = document.getElementById('resendBtnText');
            const alertEl = document.getElementById('verifAlert');

            btn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> পাঠানো হচ্ছে...';
            alertEl.classList.add('hidden');

            try {
                if (!window.HabibAuth || !window.HabibAuth.resendVerificationEmail) {
                    throw new Error("Auth system is initializing. Please wait a moment.");
                }
                const res = await window.HabibAuth.resendVerificationEmail();
                if (res.alreadyVerified) {
                    alertEl.className = "p-3.5 rounded-2xl text-xs font-bold mb-5 border bg-emerald-50 text-emerald-700 border-emerald-200";
                    alertEl.innerHTML = '<i class="fa-solid fa-check"></i> আপনার ইমেইল ইতোমধ্যে ভেরিফাইড! আপনি ড্যাশবোর্ডে প্রবেশ করতে পারেন।';
                    document.getElementById('dashboardBtn').classList.remove('hidden');
                } else {
                    alertEl.className = "p-3.5 rounded-2xl text-xs font-bold mb-5 border bg-emerald-50 text-emerald-700 border-emerald-200";
                    alertEl.innerHTML = '<i class="fa-solid fa-paper-plane"></i> নতুন ভেরিফিকেশন লিংক পাঠানো হয়েছে! ইনবক্স চেক করুন।';
                }
                alertEl.classList.remove('hidden');
            } catch (err) {
                alertEl.className = "p-3.5 rounded-2xl text-xs font-bold mb-5 border bg-red-50 text-red-700 border-red-200";
                alertEl.innerText = err.message || "Failed to resend verification email.";
                alertEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btnText.innerText = "পুনরায় ভেরিফিকেশন লিংক পাঠান (Resend Email)";
            }
        }

        async function handleCheckStatus() {
            const alertEl = document.getElementById('verifAlert');
            const dashboardBtn = document.getElementById('dashboardBtn');

            alertEl.className = "p-3.5 rounded-2xl text-xs font-bold mb-5 border bg-sky-50 text-sky-700 border-sky-200";
            alertEl.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> স্ট্যাটাস যাচাই করা হচ্ছে...';
            alertEl.classList.remove('hidden');

            try {
                if (!window.HabibAuth || !window.HabibAuth.reloadAndCheckEmailVerified) {
                    throw new Error("Auth system loading...");
                }
                const verified = await window.HabibAuth.reloadAndCheckEmailVerified();
                if (verified) {
                    alertEl.className = "p-3.5 rounded-2xl text-xs font-bold mb-5 border bg-emerald-50 text-emerald-700 border-emerald-200";
                    alertEl.innerHTML = '<i class="fa-solid fa-circle-check"></i> আপনার ইমেইল সফলভাবে ভেরিফাই হয়েছে! এখন ড্যাশবোর্ড খুলুন।';
                    dashboardBtn.classList.remove('hidden');
                } else {
                    alertEl.className = "p-3.5 rounded-2xl text-xs font-bold mb-5 border bg-amber-50 text-amber-800 border-amber-200";
                    alertEl.innerHTML = '<i class="fa-solid fa-clock"></i> এখনও ভেরিফাই করা হয়নি। অনুগ্রহ করে ইনবক্সের লিংকে ক্লিক করার পর আবার চেষ্টা করুন।';
                }
            } catch (err) {
                alertEl.className = "p-3.5 rounded-2xl text-xs font-bold mb-5 border bg-red-50 text-red-700 border-red-200";
                alertEl.innerText = err.message || "Could not check verification status.";
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
